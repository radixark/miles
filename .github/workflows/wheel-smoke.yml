name: Wheel smoke

# The built wheel, installed without Megatron, must import and parse args for FSDP and torchtitan.
# SGLang stays a source tree on PYTHONPATH until a hosted sglang-miles wheel exists.
# release-wheel.yml, dispatched on a release tag, calls this and publishes the dist it checked.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      version:
        description: 'Exact release version to stamp into setup.py before the build (rc and post tags share its base version)'
        required: false
        type: string
        default: ''
      sglang_wheel:
        description: 'With version: the sglang-miles wheel version the release wheel depends on'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  wheel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout miles
        uses: actions/checkout@v4

      - name: Resolve dependency refs
        id: resolve-refs
        uses: ./.github/actions/resolve-dependency-refs
        with:
          pr_body: ${{ github.event.pull_request.body || '' }}

      - name: Checkout sglang
        uses: actions/checkout@v4
        with:
          repository: sgl-project/sglang
          ref: ${{ steps.resolve-refs.outputs.ci_sglang_pr }}
          path: sglang

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match the Miles Docker runtime.
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Stamp the release version and its sglang pin
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          SGLANG_WHEEL: ${{ inputs.sglang_wheel }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+|\.post[0-9]+)?$ ]] \
            || { echo "::error::Invalid version: $VERSION (expected X.Y.Z, X.Y.ZrcN, or X.Y.Z.postN)"; exit 1; }
          BASE_VERSION=$(echo "$VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          grep -q "version=\"${BASE_VERSION}\"" setup.py \
            || { echo "::error::setup.py does not carry version=\"${BASE_VERSION}\""; grep -n 'version="' setup.py; exit 1; }
          sed -i "s/version=\"${BASE_VERSION}\"/version=\"${VERSION}\"/" setup.py
          # the published wheel depends on the sglang-miles wheel the release was tested with; an install from
          # the checkout does not, since the images bring their own sglang
          [ -n "$SGLANG_WHEEL" ] || { echo "::error::a release build needs the sglang wheel version to pin"; exit 1; }
          printf '\nsglang==%s\n' "$SGLANG_WHEEL" >> requirements.txt

      - name: Build the sdist and the wheel from it
        shell: bash
        run: uv build --out-dir "$RUNNER_TEMP/dist" .

      - if: inputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: miles-dist
          path: ${{ runner.temp }}/dist

      - name: Install the wheel into a clean environment
        shell: bash
        run: |
          # torch follows sglang's pin (torchtitan needs >=2.14), torchvision follows torch
          python3 -c "import tomllib; deps = tomllib.load(open('sglang/python/pyproject.toml', 'rb'))['project']['dependencies']; print(next(d for d in deps if d.startswith('torch==')))" \
            > "$RUNNER_TEMP/overrides.txt"
          echo torchvision >> "$RUNNER_TEMP/overrides.txt"
          # a release wheel pins a sglang-miles wheel PyPI does not have; sglang is the source tree here
          echo sglang > "$RUNNER_TEMP/excludes.txt"
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          VIRTUAL_ENV="$RUNNER_TEMP/venv" uv pip install \
            "$(ls "$RUNNER_TEMP"/dist/miles-*-py3-none-any.whl)[torchtitan]" \
            -r tests/ci/requirements-ci-cpu.txt \
            --override "$RUNNER_TEMP/overrides.txt" --excludes "$RUNNER_TEMP/excludes.txt"

      - name: Run the smoke check from outside the checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ github.workspace }}/sglang/python
        run: '"$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/tests/ci/wheel_smoke.py" "$GITHUB_WORKSPACE"'

      # the install above leaves the pinned sglang wheel out, so a clash between its requirements and
      # miles' own would only show at a user's pip install, after a publish that cannot be replaced
      - name: Resolve the release wheel with its sglang pin
        if: inputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SGLANG_WHEEL: ${{ inputs.sglang_wheel }}
        run: |
          # shortcut: resolved for this runner's Python 3.12 on x86_64 only; add --python-platform and
          # --python-version runs if the sglang wheels ever differ in requirements per target
          read -r NAME URL < <(gh api 'repos/radixark/miles-wheels/releases?per_page=100' --jq \
            ".[].assets[] | select(.name | startswith(\"sglang-${SGLANG_WHEEL}-cp312-\") and endswith(\"_x86_64.whl\")) | \"\(.name) \(.browser_download_url)\"") || true
          [ -n "$URL" ] || { echo "::error::no cp312 x86_64 wheel of sglang ${SGLANG_WHEEL} on radixark/miles-wheels"; exit 1; }
          curl -fsSL --create-dirs -o "$RUNNER_TEMP/sglang-wheel/$NAME" "$URL"
          uv venv --python 3.12 "$RUNNER_TEMP/resolve"
          VIRTUAL_ENV="$RUNNER_TEMP/resolve" uv pip install --dry-run \
            "$(ls "$RUNNER_TEMP"/dist/miles-*-py3-none-any.whl)[torchtitan]" --find-links "$RUNNER_TEMP/sglang-wheel"
