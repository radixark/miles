# Source: miles-run/templates/colocate-pairing.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "myrun-miles-run-colocate-pairing"
  namespace: "myns"
  labels:
    helm.sh/chart: "miles-run-0.1.0"
    app.kubernetes.io/name: "miles-run"
    app.kubernetes.io/instance: "myrun"
    app.kubernetes.io/component: "colocate-pairing"
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: "Helm"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "miles-run"
      app.kubernetes.io/instance: "myrun"
      app.kubernetes.io/component: "colocate-pairing"
  template:
    metadata:
      labels:
        helm.sh/chart: "miles-run-0.1.0"
        app.kubernetes.io/name: "miles-run"
        app.kubernetes.io/instance: "myrun"
        app.kubernetes.io/component: "colocate-pairing"
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: "Helm"
    spec:
      serviceAccountName: "myrun-miles-run-colocate-pairing"
      automountServiceAccountToken: true
      enableServiceLinks: false
      imagePullSecrets:
        - name: "myregistry-pull-secret"
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
      tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
      containers:
        - name: pairing
          image: "myregistry.example/myteam/miles:v0.9.3-cu128"
          imagePullPolicy: "IfNotPresent"
          volumeMounts:
            - name: "cluster-storage"
              mountPath: "/cluster-storage"
            - name: "cluster-storage"
              mountPath: "/root/miles"
              subPath: "myuser/miles"
            - name: "cluster-storage"
              mountPath: "/root/Megatron-LM"
              subPath: "myuser/Megatron-LM"
            - name: "models"
              mountPath: "/models"
              readOnly: true
            - name: "scratch"
              mountPath: "/scratch"
          command:
            - python
            - -m
            - miles.utils.external_utils.colocate_pairing
            - --config
            - "{\"inference_pools\":[{\"layout\":{\"gpu_offset\":0,\"num_gpus_per_inference_pod\":8,\"num_gpus_per_node\":8,\"num_inference_cells\":1,\"num_pods_per_inference_cell\":2,\"num_pods_per_trainer_cell\":4,\"num_trainer_cells\":1},\"pool_id\":\"inference-engine-all-0-0\"},{\"layout\":{\"gpu_offset\":16,\"num_gpus_per_inference_pod\":8,\"num_gpus_per_node\":8,\"num_inference_cells\":2,\"num_pods_per_inference_cell\":1,\"num_pods_per_trainer_cell\":4,\"num_trainer_cells\":1},\"pool_id\":\"inference-engine-all-0-1\"}],\"namespace\":\"rl\",\"release\":\"myrun\",\"trainer_pool_id\":\"trainer-engine-actor\"}"
          env:
            - name: "CUDA_DEVICE_MAX_CONNECTIONS"
              value: "1"
            - name: "HF_ENDPOINT"
              value: "https://hf-mirror.example"
            - name: "MILES_K8S_NAMESPACE"
              value: "myns"
            - name: "MILES_K8S_RELEASE"
              value: "myrun"
            - name: "NCCL_IB_HCA"
              value: "mlx5_0,mlx5_1"
            - name: "NCCL_SOCKET_IFNAME"
              value: "bond0"
            - name: "PYTHONUNBUFFERED"
              value: "1"
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
      volumes:
        - name: "cluster-storage"
          persistentVolumeClaim:
            claimName: miles-shared-nvme
        - name: "models"
          hostPath:
            path: "/gpfs/models"
            type: "Directory"
        - name: "scratch"
          hostPath:
            path: "/mnt/local-nvme/miles-staging"
            type: "DirectoryOrCreate"

