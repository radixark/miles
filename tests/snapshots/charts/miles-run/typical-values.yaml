run:
  colocate:
    inference_pools:
    - layout:
        gpu_offset: 0
        num_gpus_per_node: 8
        num_inference_cells: 1
        num_pods_per_inference_cell: 2
        num_pods_per_trainer_cell: 4
        num_trainer_cells: 1
      pool_id: inference-engine-0-0
    - layout:
        gpu_offset: 16
        num_gpus_per_node: 8
        num_inference_cells: 2
        num_pods_per_inference_cell: 1
        num_pods_per_trainer_cell: 4
