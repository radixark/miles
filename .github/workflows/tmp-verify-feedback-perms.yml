# Temporary pre-merge verification for PR #2720 only; deleted from the branch
# after its evidence run and never merged.
#
# Run 32637432938 already proved the fix on a same-repository PR comment:
# with pull-requests: write the real acknowledge and reply steps succeeded
# (👍 plus a bot reply on #2720), and the issues-only control failed with
# exactly HTTP 403. This revision extends the reaction evidence to a fork
# PR's comments — the two /rerun-test commands on #2038 whose runs were
# dispatched successfully but whose feedback 403'd.
#
# The synthesized issue_comment event is passed by assigning
# GITHUB_EVENT_PATH inline on the interpreter command: Actions reserves the
# GITHUB_ prefix, so a step-level env: override is ignored, and the runner
# re-materializes its own event file each step.
name: tmp-verify-feedback-perms

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  fork-comment-ack:
    if: github.event.pull_request.number == 2720
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        comment_id: ["5385284861", "5385284956"]
    steps:
      - name: Check out the trusted handler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/scripts/comment_ci_command.py
          sparse-checkout-cone-mode: false

      - name: Assemble the fork PR's command comment into an issue_comment event
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ matrix.comment_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" > "$RUNNER_TEMP/comment.json"
          gh api "repos/${GITHUB_REPOSITORY}/issues/2038" > "$RUNNER_TEMP/issue.json"
          python3 - "$RUNNER_TEMP" "$RUNNER_TEMP/event.json" <<'EOF'
          import json
          import sys

          tmp, event_path = sys.argv[1], sys.argv[2]
          with open(f"{tmp}/comment.json", encoding="utf-8") as handle:
              comment = json.load(handle)
          with open(f"{tmp}/issue.json", encoding="utf-8") as handle:
              issue = json.load(handle)
          event = {
              "action": "created",
              "repository": {"id": 1072725553, "full_name": "radixark/miles"},
              "issue": issue,
              "comment": comment,
              "sender": comment["user"],
          }
          with open(event_path, "w", encoding="utf-8") as handle:
              json.dump(event, handle)
          print(f"comment {comment['id']} by {comment['user']['login']} ({comment['author_association']})")
          print(f"body: {comment['body']}")
          EOF

      - name: Acknowledge the fork PR's command comment with the fixed scope
        env:
          CI_COMMAND_API_TOKEN: ${{ github.token }}
          CI_COMMAND_ACKNOWLEDGE: "true"
        run: GITHUB_EVENT_PATH="$RUNNER_TEMP/event.json" python3 .github/workflows/scripts/comment_ci_command.py
