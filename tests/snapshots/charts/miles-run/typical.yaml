data:
  uninstall-job.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: "myrun-miles-run-uninstall"
      namespace: "myns"
      labels:
        miles.radixark.io/uninstall-of: "myrun"
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      activeDeadlineSeconds: 1020
      template:
        metadata:
          labels:
            miles.radixark.io/uninstall-of: "myrun"
        spec:
          enableServiceLinks: false
          imagePullSecrets:
            - name: "myregistry-pull-secret"
