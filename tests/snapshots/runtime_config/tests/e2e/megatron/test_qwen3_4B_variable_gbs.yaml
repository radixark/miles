processes:
  tests/e2e/megatron/test_qwen3_4B_variable_gbs/run-0000/all/default/actor_cell00000:
    diffs:
      checkpoint_load-0000:
        set:
          <<:
          - &id001
            /args/backend/ckpt_step: null
            /args/backend/load: /root/Qwen3-4B_torch_dist
            /load: /root/Qwen3-4B_torch_dist
            /local_checkpoint_manager: false
          - &id002
            /args/backend/lr_decay_iters: 4
            /args/backend/model_type: {$enum: megatron.core.enums.ModelType, name: encoder_or_decoder}
            /args/backend/train_iters: 4
          /args/backend/finetune: false
          /args/backend/no_load_optim: null
          /args/backend/no_load_rng: null
      checkpoint_load-0001:
        set:
          <<:
          - *id001
          - *id002
          /args/backend/finetune: true
          /args/backend/no_load_optim: true
          /args/backend/no_load_rng: true
      train_first_step-0000:
        set:
          <<: *id002
          /role: actor
    ranks: [0, 1, 2, 3]
    template: trainer-megatron-02
  tests/e2e/megatron/test_qwen3_4B_variable_gbs/run-0000/all/default/inference_controller:
    diffs: &id006
      router_endpoints-0000:
        set:
          <<: &id003
            /args/sglang_model_routers: {default: {$tuple: [$HOST, $PORT]}}
            /args/sglang_router_ip: $HOST
            /args/sglang_router_port: $PORT
    overrides:
      set:
        <<:
        - &id004
          /args/allow_partial_train_step: true
          /args/config_snapshot_name: tests/e2e/megatron/test_qwen3_4B_variable_gbs/run-0000
          /args/disable_rollout_trim_samples: true
          /args/log_probs_max_tokens_per_gpu: 8192
          /args/max_tokens_per_gpu: 8192
          /args/megatron_to_hf_mode: bridge
          /args/n_samples_per_prompt: 4
          /args/num_rollout: 3
          /args/ref_load: /root/Qwen3-4B_torch_dist
          /args/rollout_max_response_len: 4096
          /args/rollout_num_gpus_per_engine: 2
          /args/sglang/base_args/tp_size: 2
          /args/sglang/models:
          - model_path: null
            name: default
            server_groups:
            - needs_offload: true
              num_gpus_per_engine: 2
              overrides: {model_path: /root/models/Qwen3-4B/}
              worker_type: {$enum: miles.backends.sglang_utils.sglang_api_client.WorkerType, name: REGULAR}
            update_weights: true
          /args/start_rollout_id: null
        - &id005
          /args/global_batch_size: 24
          /args/input_key: prompt
          /args/rollout_temperature: 0.8
          /args/use_kl_loss: true
          /args/wandb_project: miles-test_qwen3_4B_variable_gbs
    template: inference_controller-01
  tests/e2e/megatron/test_qwen3_4B_variable_gbs/run-0000/all/default/main:
    diffs:
      router_endpoints-0000:
        set:
          <<: *id003
          /args/wandb_run_id: $WANDB_RUN_ID_0000
      tracking_config-0000: {set: {/args/wandb_run_id: $WANDB_RUN_ID_0000}}
    overrides: &id007
      set:
        <<:
        - *id004
        - *id005
        /args/raw_megatron/base_args/context_parallel_size: 2
        /args/raw_megatron/base_args/data_parallel_size: 2
        /args/raw_megatron/base_args/encoder_num_layers: 36
        /args/raw_megatron/base_args/eval_global_batch_size: 24
        /args/raw_megatron/base_args/ffn_hidden_size: 9728
        /args/raw_megatron/base_args/finetune: false
        /args/raw_megatron/base_args/global_batch_size: 24
        /args/raw_megatron/base_args/hidden_size: 2560
        /args/raw_megatron/base_args/load: null
        /args/raw_megatron/base_args/no_load_optim: null
        /args/raw_megatron/base_args/no_load_rng: null
        /args/raw_megatron/base_args/num_attention_heads: 32
        /args/raw_megatron/base_args/num_layers: 36
        /args/raw_megatron/base_args/num_query_groups: 8
        /args/raw_megatron/base_args/padded_vocab_size: 151936
        /args/raw_megatron/base_args/sequence_parallel: false
        /args/raw_megatron/base_args/tensor_model_parallel_size: 1
        /args/raw_megatron/base_args/tokenizer_model: /root/models/Qwen3-4B/
        /args/raw_megatron/base_args/untie_embeddings_and_output_weights: false
        /args/raw_megatron/base_args/wandb_project: miles-test_qwen3_4B_variable_gbs
        /args/raw_megatron/base_args/world_size: 4
    template: main-01
  tests/e2e/megatron/test_qwen3_4B_variable_gbs/run-0000/all/default/rollout_executor:
    diffs: *id006
    overrides: *id007
    template: rollout_executor-01
  tests/e2e/megatron/test_qwen3_4B_variable_gbs/run-0000/all/default/trainer_controller_actor: {overrides: {set: {/args/backend/rank: 0}},
    template: trainer-megatron-02}
  tests/e2e/megatron/test_qwen3_4B_variable_gbs/run-0000/all/default/worker_manager:
    overrides: *id007
    template: worker_manager-01
shared_overrides:
  trainer-megatron-02:
    remove: [/args/backend/ckpt_step, /args/backend/finetune, /args/backend/load, /args/backend/no_load_optim, /args/backend/no_load_rng]
    set:
      <<: *id004
      /args/backend/context_parallel_size: 2
      /args/backend/data_parallel_size: 2
      /args/backend/eval_global_batch_size: 24
      /args/backend/global_batch_size: 24
      /args/backend/sequence_parallel: false
      /args/backend/wandb_project: miles-test_qwen3_4B_variable_gbs
      /args/balance_data: false
      /args/critic_load: null
      /args/init_expected_num_cells/default: 2
