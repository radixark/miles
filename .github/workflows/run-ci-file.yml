name: Verify isolated RoCE
run-name: "Verify isolated RoCE PR 3986 at 397ffb0"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-isolated-roce-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    uses: radixark/miles/.github/workflows/_run-ci.yml@397ffb0cca2f8ae568364c461eb5a5173dff4789
    with:
      ref: '397ffb0cca2f8ae568364c461eb5a5173dff4789'
      plan_already_resolved: true
      runs_on: '["h200", "8gpu"]'
      container_image: 'radixark/miles:release-v0.1.2-ci'
      skip_dependency_install: true
      execute_command: |
        set -euo pipefail
        probe_dir=$(mktemp -d)
        trap 'rm -rf "$probe_dir"' EXIT
        cat > "$probe_dir/probe.py" <<'PYTHON'
        import multiprocessing as mp
        import os
        from pathlib import Path

        os.environ["WITH_NVIDIA_PEERMEM"] = "0"
        os.environ.pop("MC_GID_INDEX", None)

        import torch
        from mooncake.engine import TransferEngine

        COUNT = 103
        CHUNK = 4096
        SIZE = COUNT * CHUNK


        def payload():
            return (torch.arange(SIZE, dtype=torch.int64) % 251 + 1).to(torch.uint8)


        def engine(device):
            transport = TransferEngine()
            assert transport.initialize("127.0.0.1:0", "P2PHANDSHAKE", "rdma", device) == 0
            return transport


        def receiver(device, ready, written):
            torch.cuda.set_device(1)
            destination = torch.zeros(SIZE, dtype=torch.uint8, device="cuda:1")
            torch.cuda.synchronize()
            transport = engine(device)
            assert transport.register_memory(destination.data_ptr(), SIZE) == 0
            ready.put((destination.data_ptr(), transport.get_rpc_port()))
            try:
                assert written.wait(120), "Timed out waiting for GPU RDMA writes"
                torch.cuda.synchronize()
                assert torch.equal(destination.cpu(), payload()), "GPU destination payload mismatch"
                print("GPU_RDMA_PAYLOAD_PASS", flush=True)
            finally:
                assert transport.unregister_memory(destination.data_ptr()) == 0


        def main():
            assert torch.cuda.device_count() >= 2, "Need two GPUs for this validation"
            devices = []
            for device in sorted(Path("/sys/class/infiniband").iterdir()):
                for entry in device.glob("ports/1/gid_attrs/ndevs/*"):
                    try:
                        if entry.read_text().strip():
                            devices.append(device.name)
                            break
                    except OSError:
                        pass
            assert len(devices) >= 2, "Need two namespace-local RDMA interfaces"
            context = mp.get_context("spawn")
            ready, written = context.Queue(), context.Event()
            target = context.Process(target=receiver, args=(devices[-1], ready, written))
            target.start()
            try:
                remote_address, port = ready.get(timeout=60)
                torch.cuda.set_device(0)
                source = payload().to("cuda:0")
                torch.cuda.synchronize()
                transport = engine(devices[0])
                assert transport.register_memory(source.data_ptr(), SIZE) == 0
                try:
                    code = transport.batch_transfer_sync_write(
                        f"127.0.0.1:{port}",
                        [source.data_ptr() + i * CHUNK for i in range(COUNT)],
                        [remote_address + i * CHUNK for i in range(COUNT)],
                        [CHUNK] * COUNT,
                    )
                    assert code == 0, f"GPU RDMA batch write failed: {code}"
                    written.set()
                    target.join(timeout=30)
                    assert target.exitcode == 0, f"GPU receiver failed: {target.exitcode}"
                    print(f"GPU_RDMA_PASS writes={COUNT} bytes={SIZE} separate_processes=True", flush=True)
                finally:
                    assert transport.unregister_memory(source.data_ptr()) == 0
            finally:
                if target.is_alive():
                    target.terminate()
                    target.join(timeout=10)


        if __name__ == "__main__":
            main()
        PYTHON
        timeout --signal=TERM --kill-after=10s 180 python3 "$probe_dir/probe.py"
