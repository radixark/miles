        group: options
        help: 'On-disk dtype for the streamed Adam moments; the fp32 master copy is always fp32. This is a serialization format,
          not a compute precision: the step still hands fp32 tensors to FusedAdam, and the cast happens on the way to and
          from disk. That makes it distinct from --exp-avg-dtype / --exp-avg-sq-dtype, which change what the optimizer holds
          and require --use-precision-aware-optimizer, so they cannot be combined with streaming at all. The step is I/O bound
          and the moments tolerate less precision than the master copy, so bf16 cuts streaming volume by a third (12 bytes
          per param to 8). fp32 is bit-identical to keeping the moments on GPU. The fp8 options need per-block scaling for
