name: Docker PR tag cleanup

on:
  pull_request:
    types: [closed]
  # Fork pull_request runs have no registry secrets. Use only the trusted
  # default-branch workflow for their fixed ROCm tag; never check out PR code.
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  delete-pr-tag:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository)
    # Explicit credential exception: closed ROCm tags use the same trusted
    # hosted cleanup and Docker Hub secret as TPU. Publication stays on Spur.
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          TOKEN=$(python3 -c "
          import json, urllib.request
          req = urllib.request.Request('https://hub.docker.com/v2/users/login/',
              data=json.dumps({'username': '${{ secrets.DOCKERHUB_USERNAME }}',
                               'password': '${{ secrets.DOCKERHUB_TOKEN }}'}).encode(),
              headers={'Content-Type': 'application/json'})
          print(json.load(urllib.request.urlopen(req))['token'])")
          # CUDA, TPU and ROCm PR images share radixark/miles.
          tags=("pr-${{ github.event.pull_request.number }}-rocm10-mi35x")
          if [ "$FORK" != true ]; then
            tags=("pr-${{ github.event.pull_request.number }}" "pr-${{ github.event.pull_request.number }}-tpu" "${tags[@]}")
          fi
          for tag in "${tags[@]}"; do
            curl -s -X DELETE \
              -H "Authorization: JWT ${TOKEN}" \
              "https://hub.docker.com/v2/repositories/radixark/miles/tags/${tag}/" \
              || true
          done
