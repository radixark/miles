# doc-dev: docs/developer/ci/02-docker-build.md
name: PR CI Image Build

on:
  workflow_call:
    inputs:
      arch:
        description: PR image architecture, a key of PR_IMAGE_ARCHES in docker/image_inputs.py
        required: true
        type: string
    outputs:
      built:
        description: Whether this call built and pushed a PR-scoped image
        value: ${{ jobs.docker-build.outputs.built }}
      tag_available:
        description: Whether a current PR-scoped image exists, built by this call or an earlier one
        value: ${{ jobs.docker-build.outputs.tag_available }}

jobs:
  # A PR keeps one image tag per architecture for its whole life (pr-<number> for amd64).
  # Rebuilds are driven by the content of the build inputs, not by whether the PR happens
  # to touch them: the published tag records its inputs hash in a label, so reruns and
  # unrelated pushes reuse the image instead of paying for an identical build.
  docker-decide:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      needs_image: ${{ steps.decide.outputs.needs_image }}
      rebuild: ${{ steps.decide.outputs.rebuild }}
      force_rebuild: ${{ steps.prepare.outputs.force_rebuild }}
      current: ${{ steps.compare.outputs.current }}
    env:
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: compare
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          emit() {
            echo "eligible=$1" >> "$GITHUB_OUTPUT"
            echo "current=$2" >> "$GITHUB_OUTPUT"
          }

          # Cron and manual runs have no PR diff and never own a PR image.
          if [ -z "$BASE_SHA" ]; then
            emit false ""
            exit 0
          fi

          # Compare the PR merge commit with its current base (HEAD^1) rather than the
          # recorded base.sha, which can lag main and pull in unrelated changes.
          read -r VARIANT _ < <(python3 docker/image_inputs.py --pr "$PR_NUMBER" --arch "$ARCH")
          CURRENT=$(python3 docker/image_inputs.py --variant "$VARIANT" --rev HEAD)
          BASE=$(python3 docker/image_inputs.py --variant "$VARIANT" --rev HEAD^1)
          if [ "$CURRENT" = "$BASE" ]; then
            echo "Build inputs match the base branch; suites use the released image."
            emit false ""
            exit 0
          fi

          emit true "$CURRENT"

      - id: prepare
        shell: bash
        env:
          ELIGIBLE: ${{ steps.compare.outputs.eligible }}
          CURRENT: ${{ steps.compare.outputs.current }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          emit() {
            echo "inspect_tag=$1" >> "$GITHUB_OUTPUT"
            echo "force_rebuild=$2" >> "$GITHUB_OUTPUT"
            echo "current=$3" >> "$GITHUB_OUTPUT"
          }

          if [ "$ELIGIBLE" != "true" ]; then
            emit false false ""
            exit 0
          fi

          LABELS=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name')
          if grep -Fxq "rebuild-ci-image" <<< "$LABELS"; then
            emit false true "$CURRENT"
          else
            emit true false "$CURRENT"
          fi

      # Registry auth is needed only when reading the inputs label from an existing tag.
      - name: Login to Docker Hub
        if: steps.prepare.outputs.inspect_tag == 'true' && env.SAME_REPO == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: decide
        shell: bash
        env:
          CURRENT: ${{ steps.prepare.outputs.current }}
          FORCE_REBUILD: ${{ steps.prepare.outputs.force_rebuild }}
          INSPECT_TAG: ${{ steps.prepare.outputs.inspect_tag }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          emit() { echo "needs_image=$1" >> "$GITHUB_OUTPUT"; echo "rebuild=$2" >> "$GITHUB_OUTPUT"; }

          if [ "$FORCE_REBUILD" = "true" ]; then
            echo "::notice::rebuild-ci-image label present; forcing a rebuild."
            emit true true
            exit 0
          fi

          if [ "$INSPECT_TAG" != "true" ]; then
            emit false false
            exit 0
          fi

          read -r VARIANT TAG < <(python3 docker/image_inputs.py --pr "$PR_NUMBER" --arch "$ARCH")
          # docker/build.py pins the ROCm PR variant to radixark/miles; every other one follows --image-repo.
          IMAGE_REPO=$GITHUB_REPOSITORY
          [ "$VARIANT" != rocm10-mi35x-pr ] || IMAGE_REPO=radixark/miles
          PUBLISHED=$(docker buildx imagetools inspect "${IMAGE_REPO}:${TAG}" \
            --format '{{ json .Image }}' 2>/dev/null \
            | python3 docker/image_inputs.py --read-label || true)

          if [ -z "$PUBLISHED" ]; then
            echo "No usable ${TAG} image; building one."
            emit true true
          elif [ "$PUBLISHED" = "$CURRENT" ]; then
            echo "${TAG} already matches the current build inputs; reusing it."
            emit true false
          else
            echo "Build inputs changed since ${TAG} was published; rebuilding."
            emit true true
          fi

  # Docker PRs build this architecture's image once the caller's gates pass.
  # Without a rebuild to do this stays on a free hosted runner as a no-op;
  # actual builds use docker-build nodes, never the GPU-suite pool.
  docker-build:
    needs: [docker-decide]
    if: always() && !cancelled() && github.event.action != 'closed'
    runs-on: ${{ fromJSON(needs.docker-decide.outputs.rebuild == 'true' && github.event.pull_request.head.repo.full_name == github.repository && '["docker-build"]' || '["ubuntu-latest"]') }}
    # The fork job waits for a separately queued builder, whose own limit is 180m.
    timeout-minutes: ${{ needs.docker-decide.outputs.rebuild == 'true' && github.event.pull_request.head.repo.full_name != github.repository && 360 || 180 }}
    outputs:
      built: ${{ steps.build.outputs.built || steps.wait.outputs.built || 'false' }}
      # Reusing an image the previous run published is as good as building one now.
      tag_available: ${{ needs.docker-decide.outputs.needs_image == 'true' && (steps.build.outputs.built == 'true' || steps.wait.outputs.built == 'true' || needs.docker-decide.outputs.rebuild != 'true') }}
    env:
      BUILD: ${{ needs.docker-decide.outputs.rebuild == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
      REQUEST_BUILD: ${{ needs.docker-decide.outputs.rebuild == 'true' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Checkout repository
        if: env.BUILD == 'true' || env.REQUEST_BUILD == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      # build-fork-ci-image.yml publishes only in radixark/miles; elsewhere the wait below would never end.
      - name: Refuse a fork image build outside radixark/miles
        if: env.REQUEST_BUILD == 'true' && github.repository != 'radixark/miles'
        run: |
          echo "::error::A fork PR that changes the image inputs needs an image build, which only radixark/miles publishes"
          exit 1
      # arm64 rides on the amd64 request; every other architecture sends its own.
      - name: Request a trusted fork image build
        if: env.REQUEST_BUILD == 'true' && inputs.arch != 'arm64'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ARCH: ${{ inputs.arch }}
          INPUTS_HASH: ${{ needs.docker-decide.outputs.current }}
          FORCE_REBUILD: ${{ needs.docker-decide.outputs.force_rebuild }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          mkdir -p "$RUNNER_TEMP/fork-ci-image-request"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          request = dict(pr=int(os.environ['PR_NUMBER']), merge_sha=os.environ['GITHUB_SHA'],
                         inputs_hash=os.environ['INPUTS_HASH'], run_id=int(os.environ['GITHUB_RUN_ID']),
                         run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
                         force_rebuild=os.environ['FORCE_REBUILD'] == 'true',
                         labels=json.loads(os.environ['PR_LABELS_JSON']))
          if os.environ['ARCH'] != 'amd64':
              request['arch'] = os.environ['ARCH']
          (Path(os.environ['RUNNER_TEMP']) / 'fork-ci-image-request/request.json').write_text(json.dumps(request))
          PY
      - uses: actions/upload-artifact@v4
        if: env.REQUEST_BUILD == 'true' && inputs.arch != 'arm64'
        with:
          name: fork-ci-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fork-ci-image-request/request.json
          retention-days: 1
          if-no-files-found: error
      - name: Wait for trusted image publication
        id: wait
        if: env.REQUEST_BUILD == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ inputs.arch }}
        run: |
          python3 .github/workflows/scripts/fork_ci_image.py wait-build --arch "$ARCH"
          echo "built=true" >> "$GITHUB_OUTPUT"
      # Shared builders accumulate buildkit cache and orphaned builder volumes
      # until the disk fills and installs die with ENOSPC mid-layer. Reclaim
      # anything idle for 48h before building; recent cache survives.
      # The daemon is shared with the host's GPU runners, so prune only what
      # holds disk: `system prune` would also delete their idle networks
      # (the aliyun rdma-rail* networks job containers need for RDMA).
      - name: Free builder disk
        if: env.BUILD == 'true'
        run: |
          df -h / || true
          docker builder prune -af --filter "until=48h" || true
          docker image prune -af --filter "until=48h" || true
          docker volume prune -f || true
          df -h / || true
      - name: Set up Docker Buildx
        if: env.BUILD == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host
      - name: Install Python + dependencies
        if: env.BUILD == 'true'
        run: |
          if ! command -v python3 >/dev/null || ! command -v pip3 >/dev/null; then
            apt-get -o DPkg::Lock::Timeout=600 update
            apt-get -o DPkg::Lock::Timeout=600 install -y python3 python3-pip
          fi
          # Older pip (<23) lacks --break-system-packages; newer PEP 668
          # systems require it. Probe instead of assuming either.
          PIP_BSP=""
          pip3 install --help 2>/dev/null | grep -q -- --break-system-packages && PIP_BSP="--break-system-packages"
          pip3 install $PIP_BSP --ignore-installed typer
      - name: Login to Docker Hub
        if: env.BUILD == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push PR tag
        id: build
        if: env.BUILD == 'true'
        env:
          BUILD_GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ARCH: ${{ inputs.arch }}
        run: |
          read -r VARIANT TAG < <(python3 docker/image_inputs.py --pr "$PR_NUMBER" --arch "$ARCH")
          python3 docker/build.py --variant "$VARIANT" --image-tag custom --custom-tag "$TAG" --image-repo "$GITHUB_REPOSITORY" --push
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Nothing to build
        if: env.BUILD != 'true' && env.REQUEST_BUILD != 'true'
        run: echo "No rebuild needed; suites use the PR image if it exists, else the released one."
