# miles' TPU path against the sglang-torchtpu APIs it calls, at the commit docker/Dockerfile.tpu pins, on a hosted
# CPU runner (no TPU needed). It runs tests/fast/backends/tpu, whose files skip in the regular CPU lane (no sglang_tpu
# there). PR-only: a scheduled run of sglang-torchtpu main would execute third-party code next to the default
# branch's Actions cache, and a pin bump is a PR that runs this job anyway.
name: TPU contract (sglang-torchtpu, CPU)

on:
  pull_request:
    # the tests scan every server arg miles reads, so any miles file can break the contract
    paths:
      - "miles/**"
      - "scripts/tpu/**"
      - "requirements.txt"
      - "tests/ci/requirements-ci-cpu.txt"
      - "docker/Dockerfile.tpu"
      - "tests/fast/backends/tpu/**"
      - ".github/workflows/tpu-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout miles
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Read the pinned sglang-torchtpu commit
        id: pin
        shell: bash
        # an empty ref would check out sglang-torchtpu's default branch instead of the pin
        run: |
          commit=$(sed -n 's/^ARG SGLANG_TPU_COMMIT=//p' docker/Dockerfile.tpu)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "no 40-hex ARG SGLANG_TPU_COMMIT in docker/Dockerfile.tpu: '$commit'"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Checkout sglang-torchtpu at the pin
        uses: actions/checkout@v4
        with:
          repository: sgl-project/sglang-torchtpu
          ref: ${{ steps.pin.outputs.commit }}
          path: sglang-torchtpu
          persist-credentials: false

      - name: Install dependencies
        shell: bash
        env:
          UV_SYSTEM_PYTHON: "1"
        # miles' pins, which docker/Dockerfile.tpu installs over the engine's; the request structs and routes
        # checked here do not depend on the engine's own pins
        run: |
          uv pip install -r requirements.txt -r tests/ci/requirements-ci-cpu.txt uvloop soundfile
          echo "PYTHONPATH=$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/sglang-torchtpu/python:$GITHUB_WORKSPACE/sglang-torchtpu" >> "$GITHUB_ENV"

      - name: Run the contract tests
        shell: bash
        env:
          SGLANG_BUILD_RUST_EXTS: none
        run: |
          python -c 'import sglang, sglang_tpu; print(sglang.__file__, sglang_tpu.__file__)'
          python -m pytest -q tests/fast/backends/tpu
