name: Release Tag
# Creates the vX.Y.Z tag that triggers release-docker.yml. Use after the
# release branch's full CI (a release-branch-cut.yml run) is green.
#
# Unlike sglang's release-tag.yml, this one refuses to tag blind: pass the
# run ID of the green release-branch-cut run (ci_run_id), or force=true to
# skip the check deliberately.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag, without v prefix (e.g., 0.3.0 or 0.3.0.post1)'
        required: true
        type: string
      ref:
        description: 'Branch or commit to tag (e.g., release/v0.3.0)'
        required: true
        type: string
      ci_run_id:
        description: 'Run ID of the green release-branch-cut.yml run that tested this ref'
        required: false
        type: string
        default: ''
      force:
        description: 'Tag without a verified CI run (not recommended)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  create-tag:
    if: github.repository == 'radixark/miles'
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+((rc|\.post)[0-9]+)?$'; then
            echo "::error::Invalid version: $VERSION (expected X.Y.Z, X.Y.ZrcN, or X.Y.Z.postN)"
            exit 1
          fi

      - name: Verify CI run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CI_RUN_ID="${{ github.event.inputs.ci_run_id }}"
          if [ -z "$CI_RUN_ID" ]; then
            if [ "${{ github.event.inputs.force }}" = "true" ]; then
              echo "::warning::Tagging without a verified CI run (force=true)"
              exit 0
            fi
            echo "::error::Provide ci_run_id of the green release-branch-cut run, or force=true"
            exit 1
          fi
          CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs/$CI_RUN_ID" -q '.conclusion')
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI run $CI_RUN_ID conclusion is '$CONCLUSION', not 'success'"
            exit 1
          fi
          echo "CI run $CI_RUN_ID verified green"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - name: Verify version matches setup.py
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          # rc/postN tags share the branch with the base release and setup.py
          # keeps the base version (hotfixes don't bump), so compare X.Y.Z only.
          BASE_VERSION=$(echo "$VERSION" | sed -E 's/(rc[0-9]+|\.post[0-9]+)$//')
          if ! grep -q "version=\"${BASE_VERSION}\"" setup.py; then
            echo "::error::setup.py at '${{ github.event.inputs.ref }}' does not carry version=\"${BASE_VERSION}\" — merge the bump PR (release step ①) and get it onto this branch first"
            grep -n 'version="' setup.py
            exit 1
          fi
          echo "setup.py version matches ${BASE_VERSION}"

      - name: Create and push tag
        run: |
          TAG="v${{ github.event.inputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi
          git config user.name "miles-bot"
          git config user.email "miles-bot@users.noreply.github.com"
          echo "Tagging $TAG at $(git rev-parse HEAD) (ref ${{ github.event.inputs.ref }})"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Trigger release-docker build
        # A tag pushed with GITHUB_TOKEN does not fire release-docker.yml's
        # tag trigger (GitHub suppresses workflow-triggering events from
        # GITHUB_TOKEN), so dispatch it explicitly. The tag trigger stays for
        # manually pushed tags.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release-docker.yml \
            -f version="${{ github.event.inputs.version }}" \
            -f ref="v${{ github.event.inputs.version }}"
          echo "::notice::Dispatched release-docker.yml for v${{ github.event.inputs.version }}"
