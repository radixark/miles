          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_use_ray
        group: options
        help: Use Ray actors for scheduler process management.
        nargs: 0
        option_strings:
        - --sglang-use-ray
        type: null
      - default: null
        dest: sglang_numa_node
        group: options
