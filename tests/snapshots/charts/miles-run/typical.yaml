apiVersion: v1
kind: ConfigMap
metadata:
  name: "myrun-miles-run-uninstall-manifest"
  namespace: "myns"
  labels:
    helm.sh/chart: "miles-run-0.1.0"
    app.kubernetes.io/name: "miles-run"
    app.kubernetes.io/instance: "myrun"
    app.kubernetes.io/component: "uninstall"
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: "Helm"
data:
  uninstall-job.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: "myrun-miles-run-uninstall"
      namespace: "myns"
      labels:
        miles.radixark.io/uninstall-of: "myrun"
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      activeDeadlineSeconds: 1020
      template:
        metadata:
          labels:
            miles.radixark.io/uninstall-of: "myrun"
        spec:
          enableServiceLinks: false
          imagePullSecrets:
            - name: "myregistry-pull-secret"
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
          tolerations:
            - effect: NoSchedule
              key: nvidia.com/gpu
              operator: Exists
          serviceAccountName: "miles-uninstaller"
          restartPolicy: Never
          containers:
            - name: uninstall
              image: "myregistry.example/myteam/miles:v0.9.3-cu128"
              imagePullPolicy: "IfNotPresent"
              command:
                - sh
                - -c
                - "sleep 120 && helm uninstall myrun --namespace myns --ignore-not-found"

