name: Wheel smoke

# The built wheel, installed without Megatron, must import and parse args for FSDP and torchtitan.
# SGLang stays a source tree on PYTHONPATH until a hosted sglang-miles wheel exists.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  wheel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout miles
        uses: actions/checkout@v4

      - name: Resolve dependency refs
        id: resolve-refs
        uses: ./.github/actions/resolve-dependency-refs
        with:
          pr_body: ${{ github.event.pull_request.body || '' }}

      - name: Checkout sglang
        uses: actions/checkout@v4
        with:
          repository: sgl-project/sglang
          ref: ${{ steps.resolve-refs.outputs.ci_sglang_pr }}
          path: sglang

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match the Miles Docker runtime.
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build the sdist and the wheel from it
        shell: bash
        run: uv build --out-dir "$RUNNER_TEMP/dist" .

      - name: Install the wheel into a clean environment
        shell: bash
        run: |
          # torch follows sglang's pin (torchtitan needs >=2.13), torchvision follows torch
          python3 -c "import tomllib; deps = tomllib.load(open('sglang/python/pyproject.toml', 'rb'))['project']['dependencies']; print(next(d for d in deps if d.startswith('torch==')))" \
            > "$RUNNER_TEMP/overrides.txt"
          echo torchvision >> "$RUNNER_TEMP/overrides.txt"
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          VIRTUAL_ENV="$RUNNER_TEMP/venv" uv pip install \
            "$(ls "$RUNNER_TEMP"/dist/miles-*-py3-none-any.whl)[torchtitan]" \
            -r tests/ci/requirements-ci-cpu.txt \
            --override "$RUNNER_TEMP/overrides.txt"

      - name: Run the smoke check from outside the checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ github.workspace }}/sglang/python
        run: '"$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/tests/ci/wheel_smoke.py" "$GITHUB_WORKSPACE"'
