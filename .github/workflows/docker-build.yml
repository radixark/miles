name: Docker Build & Push

on:
  push:
    branches:
      - main
    paths:
      - 'docker/Dockerfile'
      - 'docker/install-kube-tools.sh'
      - 'docker/verify_transformer_engine.py'
      - 'requirements.txt'

  schedule:
    # Poll every 10 minutes so an upstream move starts a build within ~30 minutes;
    # check-upstream gates each poll. Off the top of the hour, where GitHub delays
    # or drops scheduled runs under load.
    - cron: '5,15,25,35,45,55 * * * *'

  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        type: choice
        options:
          - cu13
          - cu13-x86
          - cu13-aarch64
          - cu12-x86
          - rubin
          - rocm724-mi35x
          - rocm10-mi35x
      image_tag:
        description: 'Tag mode: latest, dev (rolling + timestamped), or custom'
        required: true
        type: choice
        options:
          - dev
          - latest
          - custom
      custom_tag:
        description: 'Custom tag name (only used when image_tag is custom)'
        required: false
        default: ''
        type: string
      dockerfile:
        description: 'Path to Dockerfile (e.g. docker/Dockerfile)'
        required: false
        default: 'docker/Dockerfile'
        type: string
      simulate_schedule:
        description: '[DEBUG] Simulate a scheduled build (runs upstream check)'
        required: false
        type: boolean
        default: false

jobs:
  check-upstream:
    # Only run on schedule (or simulated schedule) — check if upstream repos have new commits
    if: github.event_name == 'schedule' || inputs.simulate_schedule == true
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Restore last known upstream SHAs
        uses: actions/cache/restore@v4
        with:
          path: last_upstream_shas.txt
          key: upstream-shas-
          restore-keys: upstream-shas-

      - name: Check for new upstream commits
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          SHOULD_BUILD=false

          # A failed lookup must not read as an upstream move (an error body stored as
          # the "SHA" would build now and again once the API recovers), and must not pass
          # silently either: fail this poll without building or saving state, so a lookup
          # that keeps failing shows as red runs instead of quietly stopping rebuilds.
          fail_poll() {
            echo "::error::$1"
            exit 1
          }

          # Retry transient API errors (e.g. HTTP 502) so only a lookup that keeps
          # failing reaches fail_poll. Buffer each attempt so a failed attempt's error
          # body never mixes into the output.
          gh_api() {
            local out attempt
            for attempt in 1 2 3; do
              out=$(gh api "$@") && { printf '%s\n' "$out"; return 0; }
              [ "$attempt" -lt 3 ] && sleep 10
            done
            return 1
          }

          head_sha() {
            local sha
            sha=$(gh_api "repos/$1/commits/$2" --jq .sha) && [[ "$sha" =~ ^[0-9a-f]{40}$ ]] && echo "$sha"
          }
          SGLANG_SHA=$(head_sha sgl-project/sglang sglang-miles) || fail_poll "sglang sglang-miles HEAD lookup failed"
          MEGATRON_SHA=$(head_sha radixark/Megatron-LM miles-main) || fail_poll "Megatron-LM miles-main HEAD lookup failed"

          # Fingerprint the miles-wheels releases the images install from (sgl-router +
          # the other prebuilt wheels). cu13 installs cu130-torch213-x86_64 /
          # cu130-torch213-aarch64;
          # cu12-x86 installs cu129-x86_64 — both build automatically, so track all rolling
          # release tags they bake. Rolling tags stay fixed while assets may be replaced,
          # so fingerprint the asset list rather than a commit SHA.
          wheels_fp() {
            local fp
            fp=$(gh_api "repos/yueming-yuan/miles-wheels/releases/tags/$1" \
              | python3 -c "import sys,json,hashlib; a=json.load(sys.stdin).get('assets',[]); fp=sorted([x['name'],x['id'],x['size'],x['updated_at']] for x in a); print(hashlib.sha256(repr(fp).encode()).hexdigest() if a else '')") \
              && [[ "$fp" =~ ^[0-9a-f]{64}$ ]] && echo "$fp"
          }
          WHEELS_CU13_X86_FP=$(wheels_fp cu130-torch213-x86_64) || fail_poll "wheels cu130-torch213-x86_64 lookup failed"
          WHEELS_CU13_ARM64_FP=$(wheels_fp cu130-torch213-aarch64) || fail_poll "wheels cu130-torch213-aarch64 lookup failed"
          WHEELS_CU12_X86_FP=$(wheels_fp cu129-x86_64) || fail_poll "wheels cu129-x86_64 lookup failed"

          echo "sglang HEAD:   ${SGLANG_SHA}"
          echo "megatron HEAD: ${MEGATRON_SHA}"
          echo "wheels FP cu13 x86:   ${WHEELS_CU13_X86_FP}"
          echo "wheels FP cu13 arm64: ${WHEELS_CU13_ARM64_FP}"
          echo "wheels FP cu12 x86:   ${WHEELS_CU12_X86_FP}"

          # Compare against last known values stored in cache
          CACHE_FILE="last_upstream_shas.txt"
          if [ -f "$CACHE_FILE" ]; then
            LAST_SGLANG=$(sed -n '1p' "$CACHE_FILE")
            LAST_MEGATRON=$(sed -n '2p' "$CACHE_FILE")
            LAST_WHEELS_CU13_X86=$(sed -n '3p' "$CACHE_FILE")
            LAST_WHEELS_CU13_ARM64=$(sed -n '4p' "$CACHE_FILE")
            LAST_WHEELS_CU12_X86=$(sed -n '5p' "$CACHE_FILE")
            LAST_BUILD_EPOCH=$(sed -n '6p' "$CACHE_FILE")
          else
            LAST_SGLANG=""
            LAST_MEGATRON=""
            LAST_WHEELS_CU13_X86=""
            LAST_WHEELS_CU13_ARM64=""
            LAST_WHEELS_CU12_X86=""
            LAST_BUILD_EPOCH=""
          fi

          if [ "$SGLANG_SHA" != "$LAST_SGLANG" ] || [ "$MEGATRON_SHA" != "$LAST_MEGATRON" ] || [ "$WHEELS_CU13_X86_FP" != "$LAST_WHEELS_CU13_X86" ] || [ "$WHEELS_CU13_ARM64_FP" != "$LAST_WHEELS_CU13_ARM64" ] || [ "$WHEELS_CU12_X86_FP" != "$LAST_WHEELS_CU12_X86" ]; then
            SHOULD_BUILD=true
            echo "Upstream change detected"
          else
            echo "No upstream changes"
          fi

          # miles commits alone never trigger rebuilds, so bound how stale the baked
          # miles checkout can get: rebuild once the last triggered build is 12h old.
          MAX_BUILD_AGE_SECONDS=$(( 12 * 3600 ))
          NOW_EPOCH=$(date +%s)
          if [ "$SHOULD_BUILD" = "false" ]; then
            if ! [ "$LAST_BUILD_EPOCH" -gt 0 ] 2>/dev/null; then
              SHOULD_BUILD=true
              echo "No last-build timestamp recorded; rebuilding"
            elif [ $(( NOW_EPOCH - LAST_BUILD_EPOCH )) -ge $MAX_BUILD_AGE_SECONDS ]; then
              SHOULD_BUILD=true
              echo "Last build was $(( (NOW_EPOCH - LAST_BUILD_EPOCH) / 3600 ))h ago (max $(( MAX_BUILD_AGE_SECONDS / 3600 ))h); rebuilding"
            fi
          fi

          # Save current values for next run (cached only when a build triggers,
          # so line 6 = when the last build was kicked off).
          echo "${SGLANG_SHA}" > "$CACHE_FILE"
          echo "${MEGATRON_SHA}" >> "$CACHE_FILE"
          echo "${WHEELS_CU13_X86_FP}" >> "$CACHE_FILE"
          echo "${WHEELS_CU13_ARM64_FP}" >> "$CACHE_FILE"
          echo "${WHEELS_CU12_X86_FP}" >> "$CACHE_FILE"
          echo "${NOW_EPOCH}" >> "$CACHE_FILE"

          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"

      - name: Save upstream SHAs to cache
        if: steps.check.outputs.should_build == 'true'
        uses: actions/cache/save@v4
        with:
          path: last_upstream_shas.txt
          key: upstream-shas-${{ github.run_id }}

  build-and-push:
    needs: [check-upstream]
    # schedule: only build if upstream changed
    # push/dispatch: build; simulate_schedule runs the check but does not gate the manual build
    if: |
      always() &&
      (github.event_name != 'schedule' || needs.check-upstream.outputs.should_build == 'true')
    # Automatic builds (schedule, push) run one at a time: a build outlasts the poll
    # interval, and overlapping ones race to push dev / latest. A newer pending build
    # replaces an older one, which is safe because builds clone branch HEADs when they
    # start. Manual dispatches and polls that skip the build get a per-run group, so
    # they never wait on, or cancel, an automatic build.
    concurrency:
      group: ${{ github.event_name != 'workflow_dispatch' && (github.event_name != 'schedule' || needs.check-upstream.outputs.should_build == 'true') && 'docker-build-auto' || format('docker-build-{0}', github.run_id) }}
      cancel-in-progress: false
    # The build itself never touches a GPU (buildx sandboxes RUN steps); docker-build
    # nodes are CI machines carrying a second runner instance dedicated to builds, so
    # image builds stop competing for GPU-suite runner slots.
    runs-on: ["docker-build"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Install Python + dependencies
        run: |
          if ! command -v python3 >/dev/null || ! command -v pip3 >/dev/null; then
            apt-get -o DPkg::Lock::Timeout=600 update
            apt-get -o DPkg::Lock::Timeout=600 install -y python3 python3-pip
          fi
          # Older pip (<23) lacks --break-system-packages; newer PEP 668
          # systems require it. Probe instead of assuming either.
          PIP_BSP=""
          pip3 install --help 2>/dev/null | grep -q -- --break-system-packages && PIP_BSP="--break-system-packages"
          pip3 install $PIP_BSP --ignore-installed typer

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          python3 docker/build.py \
            --variant ${{ inputs.variant || 'cu13' }} \
            --image-tag ${{ inputs.image_tag || 'dev' }} \
            --dockerfile ${{ inputs.dockerfile || 'docker/Dockerfile' }} \
            ${{ inputs.custom_tag && format('--custom-tag {0}', inputs.custom_tag) || '' }} \
            --push

      - name: Build and push cu12-x86 (automatic builds only)
        # schedule / push-to-main leave inputs.variant empty → also build the cu12.9 legacy
        # image; a manual workflow_dispatch builds only the single variant the user picked.
        if: ${{ !inputs.variant }}
        run: |
          python3 docker/build.py --variant cu12-x86 --image-tag dev --push

      - name: Point latest to current dev
        # schedule only: latest is published registry state, so — like prune — a [DEBUG]
        # simulate_schedule must not move it. A scheduled run always builds both variants.
        if: github.event_name == 'schedule'
        run: |
          docker buildx imagetools create -t radixark/miles:latest radixark/miles:dev
          docker buildx imagetools create -t radixark/miles:latest-cu12 radixark/miles:dev-cu12

      - name: Prune old dev tags
        if: github.event_name == 'schedule'
        run: |
          KEEP=20
          # A pinned dev-<ts> tag (see docs/developer/versions.md) must outlive this many
          # days however often builds run, so the count limit alone never deletes it.
          MIN_AGE_DAYS=14
          CUTOFF=$(date -u -d "${MIN_AGE_DAYS} days ago" +%Y%m%d%H%M)
          IMAGE=radixark/miles

          # Authenticate with Docker Hub API
          TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d '{"username":"${{ secrets.DOCKERHUB_USERNAME }}","password":"${{ secrets.DOCKERHUB_TOKEN }}"}' \
            | jq -r .token)

          # Keep the newest $KEEP timestamped tags matching $1 plus any younger than
          # $MIN_AGE_DAYS days, delete the rest.
          # cu13 (dev-<ts>) and cu12-x86 (dev-cu12-<ts>) are pruned as independent series.
          prune_series() {
            PATTERN="$1"
            TAGS=""
            URL="https://hub.docker.com/v2/repositories/${IMAGE}/tags/?page_size=100"
            while [ "$URL" != "null" ] && [ -n "$URL" ]; do
              RESP=$(curl -s -H "Authorization: JWT ${TOKEN}" "$URL")
              PAGE_TAGS=$(echo "$RESP" | jq -r '.results[].name' | grep -E "$PATTERN" || true)
              TAGS="${TAGS}${PAGE_TAGS}"$'\n'
              URL=$(echo "$RESP" | jq -r '.next')
            done

            SORTED=$(echo "$TAGS" | grep -v '^$' | sort)
            COUNT=$(echo "$SORTED" | wc -l | tr -d ' ')
            echo "Found ${COUNT} tags matching ${PATTERN}"
            if [ "$COUNT" -le "$KEEP" ]; then
              echo "Nothing to prune for ${PATTERN} (keep=${KEEP})"
              return
            fi

            DELETE_COUNT=$((COUNT - KEEP))
            echo "Pruning up to ${DELETE_COUNT} old tags matching ${PATTERN}..."
            echo "$SORTED" | head -n "$DELETE_COUNT" | while read -r TAG; do
              [ -z "$TAG" ] && continue
              if [ "${TAG##*-}" -ge "$CUTOFF" ]; then
                echo "  Keeping ${TAG} (younger than ${MIN_AGE_DAYS} days)"
                continue
              fi
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Authorization: JWT ${TOKEN}" \
                "https://hub.docker.com/v2/repositories/${IMAGE}/tags/${TAG}/")
              if [ "$HTTP_CODE" = "204" ]; then
                echo "  Deleted ${TAG}"
              else
                echo "  Failed to delete ${TAG} (HTTP ${HTTP_CODE})"
              fi
            done
          }

          prune_series '^dev-[0-9]{12}$'
          prune_series '^dev-cu12-[0-9]{12}$'

  # A failed automatic build leaves the published images behind their inputs until a
  # later build succeeds, so report it to the Miles CI Lark group on the first failure.
  # Manual dispatches are left to whoever started them.
  notify-build-failure:
    needs: [build-and-push]
    if: |
      always() && github.repository == 'radixark/miles' &&
      needs.build-and-push.result == 'failure' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the notifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/scripts/lark_notify.py
            .github/workflows/scripts/ci_failure_analysis.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Post the build failure card
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
          RUN_ID: ${{ github.run_id }}
        run: python .github/workflows/scripts/lark_notify.py docker-build-failure --run-id "$RUN_ID"
