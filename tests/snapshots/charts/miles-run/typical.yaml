# Source: miles-run/templates/colocate-pairing.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "myrun-miles-run-colocate-pairing"
  namespace: "myns"
  labels:
    helm.sh/chart: "miles-run-0.1.0"
    app.kubernetes.io/name: "miles-run"
    app.kubernetes.io/instance: "myrun"
    app.kubernetes.io/component: "colocate-pairing"
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: "Helm"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "miles-run"
      app.kubernetes.io/instance: "myrun"
      app.kubernetes.io/component: "colocate-pairing"
  template:
    metadata:
      labels:
        helm.sh/chart: "miles-run-0.1.0"
        app.kubernetes.io/name: "miles-run"
        app.kubernetes.io/instance: "myrun"
        app.kubernetes.io/component: "colocate-pairing"
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: "Helm"
    spec:
      serviceAccountName: "myrun-miles-run-colocate-pairing"
      automountServiceAccountToken: true
      enableServiceLinks: false
      imagePullSecrets:
        - name: "myregistry-pull-secret"
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
      tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
      containers:
        - name: pairing
          image: "myregistry.example/myteam/miles:v0.9.3-cu128"
          imagePullPolicy: "IfNotPresent"
          volumeMounts:
            - name: shared-storage
              mountPath: "/cluster-storage"
            - name: shared-storage
              mountPath: "/root/miles"
              subPath: "myuser/miles"
            - name: shared-storage
              mountPath: "/root/Megatron-LM"
              subPath: "myuser/Megatron-LM"
            - name: node-local
              mountPath: "/scratch"
          command:
            - python
            - -m
            - miles.utils.external_utils.colocate_pairing
            - --namespace
            - "myns"
            - --release
            - "myrun"
            - --engine-component
            - "myrun-miles-run-inference-engine-0-1"
            - --trainer-component
            - "myrun-miles-run-trainer-engine-actor"
            - --engine-cells
            - "4"
            - --trainer-cells
            - "1"
            - --pods-per-engine-cell
            - "1"
            - --pods-per-trainer-cell
            - "4"
          env:
            - name: "CUDA_DEVICE_MAX_CONNECTIONS"
              value: "1"
            - name: "HF_ENDPOINT"
              value: "https://hf-mirror.example"
            - name: "MILES_K8S_NAMESPACE"
              value: "myns"
            - name: "MILES_K8S_RELEASE"
              value: "myrun"
            - name: "NCCL_IB_HCA"
              value: "mlx5_0,mlx5_1"
            - name: "NCCL_SOCKET_IFNAME"
              value: "bond0"
            - name: "PYTHONPATH"
              value: "<REPO_ROOT>:/root/Megatron-LM"
            - name: "PYTHONUNBUFFERED"
              value: "1"
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: "miles-shared-nvme"
        - name: node-local
          hostPath:
            path: "/mnt/local-nvme/miles-staging"
            type: DirectoryOrCreate

