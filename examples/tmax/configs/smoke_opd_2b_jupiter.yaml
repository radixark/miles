# smoke_opd_2b.yaml on Jupiter's H100s (80GB): pure OPD, sync and colocated, allenai/tmax-2b into hamishivi/Qwen3.5-2B,
# 3 steps of 4 prompts x 4 samples on a 64-prompt subset, 16k per episode, sandboxes on the podman fleet. Jupiter runs
# the CUDA 13 image through its forward-compatibility driver (beaker/tmax_beaker_entry.sh). Differs from the holmes
# config in the beaker: section (ai2/oe-agents, 1 h min_runtime) and the fused log-prob backend, which 80GB needs for
# 16k-token episodes (smoke_opd_4b_async_jupiter_fused.yaml).
exp_name: tmax_smoke_opd_2b_jupiter
model_name: Qwen3.5-2B-tmax-template
opd_teacher: tmax-2b
opd_pure: true
sandbox_backend: gateway                      # containers on the fleet behind beaker.gateway_registry
num_gpus_per_node: 4
num_prompts: 64
rollout_batch_size: 4
n_samples_per_prompt: 4
num_rollout: 3
max_seq_len: 16384
tensor_model_parallel_size: 1
optimizer_cpu_offload: false
sglang_mem_fraction_static: 0.6
filter_zero_std: false
save_interval: 1000
episode_timeout_s: 3600
model_dir: /weka/nora-default/shashankg/miles_tmax_v2/models
data_dir: /weka/nora-default/shashankg/miles_tmax_v2/datasets
output_dir: /weka/nora-default/shashankg/miles_tmax_v2/output
trace_dir: /weka/oe-adapt-default/allennlp/deletable_rollouts/miles
dump_training_data: true
extra_args: "--log-probs-backend fused"         # prod's; streams the logits instead of an fp32 copy

beaker:
  cluster: ai2/jupiter
  workspace: ai2/oe-agents
  budget: ai2/oe-omai
  priority: urgent
  min_runtime: 1h                             # on ai2/oe-agents' Jupiter allocation; preemptible jobs only backfill
                                              # unallocated slots, which are about all taken
  retries: 0
  gpus: 4
  shared_memory: 256GiB
  image: docker.io/radixark/miles:dev-202610151741
  # The fleet's head registry: the head starts a gateway from it (weka bucket oe-adapt-default is mounted). The fleet
  # literegistry's owners started for us on 2026-10-21, not the one the gateway prod run uses.
  gateway_registry: head+sqlite:///weka/oe-adapt-default/gfaria/primebeaker/registries/podman-private-reasoning-20261017.sqlite3
  dockerhub_username: shashankg209
