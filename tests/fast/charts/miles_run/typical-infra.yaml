infra:
  image:
    repository: myregistry.example/myteam/miles
    tag: v0.9.3-cu128
    pullPolicy: IfNotPresent
    pullSecrets:
    - myregistry-pull-secret
  sharedStorage:
    type: pvc
    pvcClaimName: miles-shared-nvme
    mountPath: /cluster-storage
  paths:
    runsSubPath: myteam/miles_data
    repos:
      miles: myuser/miles
      megatron: myuser/Megatron-LM
  nodeLocalStorage:
    hostPath: /mnt/local-nvme/miles-staging
    mountPath: /scratch
  scheduling:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
    tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  env:
    NCCL_SOCKET_IFNAME: bond0
    NCCL_IB_HCA: mlx5_0,mlx5_1
    HF_ENDPOINT: https://hf-mirror.example
