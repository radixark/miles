name: CI Job (ROCm)

on:
  workflow_call:
    inputs:
      execute_command:
        type: string
        required: true
      runs_on:
        type: string
        required: true
        description: 'JSON-encoded list of runner labels (all required). e.g. ''["linux-miles-mi35x-spur"]'' picks the Spur login-node runners.'
      num_gpus:
        description: 'GPUs per shard: the cluster job asks the scheduler for this many (1, 2, 4 or 8).'
        type: number
        required: false
        default: 4
      container_image:
        # No default: pr-test-rocm.yml's resolve-ci-image is the single
        # source of the image name, so a dated tag can't rot here.
        type: string
        required: true
      skip_dependency_install:
        # Default false, as in _run-ci.yml: install the resolved SGLang /
        # Megatron-LM refs over the image's baked copies. True keeps the baked ones.
        type: boolean
        required: false
        default: false
      ref:
        description: 'Git ref to check out (empty = the triggering commit). Set by release CI to test a release branch.'
        type: string
        required: false
        default: ''
    secrets:
      WANDB_API_KEY:
        required: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_tests: ${{ steps.select.outputs.has_tests }}
      ref: ${{ steps.select.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve suite plan
        id: select
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          ${{ inputs.execute_command }} --list-only --github-output "$GITHUB_OUTPUT"

  run:
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.has_tests == 'true'
    # The runners are Spur (Slurm) login-node runners on AMD's MI355X cluster:
    # the job itself does no GPU work. launch.sh submits one cluster job per
    # shard, and that job runs container_steps.sh in the ROCm CI image with
    # only the GPUs the scheduler assigned it (see .github/workflows/scripts/spur/).
    #
    # fromJSON parses the input list so `runs-on` receives an actual array.
    # Without this, GitHub treats the string verbatim as one label literal
    # (e.g. the label name '["linux-miles-mi35x-spur"]' with brackets), which
    # no runner carries, and the job queues forever.
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 250

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - name: Resolve dependency refs
        if: ${{ !inputs.skip_dependency_install }}
        id: resolve-refs
        uses: ./.github/actions/resolve-dependency-refs
        with:
          megatron_ref: ${{ github.event.inputs.ci_megatron_pr || '' }}
          sglang_ref: ${{ github.event.inputs.ci_sglang_pr || '' }}
          pr_body: ${{ github.event.pull_request.body || '' }}

      - name: Resolve Megatron Bridge override
        id: resolve-bridge
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          INPUT_BRIDGE_PR: ${{ github.event.inputs.ci_megatron_bridge_pr || '' }}
        run: |
          # Same directive as .github/actions/install-megatron-bridge, which
          # can't run here; container_steps.sh does its install and check.
          BRIDGE_PR="${INPUT_BRIDGE_PR}"
          if [ -z "$BRIDGE_PR" ] && [ -n "$PR_BODY" ]; then
            BRIDGE_PR=$(printf '%s\n' "$PR_BODY" | grep -m1 -oP '^ci-megatron-bridge-pr:\s+\K\S+' || true)
          fi
          if [[ "$BRIDGE_PR" =~ ^#([0-9]+)$ ]]; then
            BRIDGE_PR="refs/pull/${BASH_REMATCH[1]}/head"
          elif [ -n "$BRIDGE_PR" ] && [[ ! "$BRIDGE_PR" =~ ^[A-Za-z0-9_][A-Za-z0-9_./-]*$ ]]; then
            echo "::error::Invalid Megatron Bridge ref: $BRIDGE_PR"
            exit 1
          fi
          echo "ci_bridge_pr=$BRIDGE_PR" >> "$GITHUB_OUTPUT"
          echo "Resolved: bridge=${BRIDGE_PR:-<image's own>}"

      # HF_TOKEN and the Docker Hub login come from the runner's .env, not repo
      # secrets; do not set them here, since even an empty value overrides the
      # runner's.
      - name: Run tests on a cluster node
        timeout-minutes: 240
        shell: bash
        env:
          CI_IMAGE: ${{ inputs.container_image }}
          CI_COMMAND: ${{ inputs.execute_command }}
          CI_SKIP_DEPENDENCY_INSTALL: ${{ inputs.skip_dependency_install }}
          MEGATRON_PR: ${{ steps.resolve-refs.outputs.ci_megatron_pr }}
          SGLANG_PR: ${{ steps.resolve-refs.outputs.ci_sglang_pr }}
          BRIDGE_REF: ${{ steps.resolve-bridge.outputs.ci_bridge_pr }}
          MILES_HARDWARE_PLATFORM: rocm
          GITHUB_COMMIT_NAME: ${{ github.event.pull_request.head.sha || github.sha }}_${{ github.event.pull_request.number || 'non-pr' }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          # The CI partition is shared with SGLang's CI and sgl-amd-mono; Miles
          # owns crsuse2-m2m-v3-025 and v3-090, so keep its jobs off the rest.
          SLURM_EXCLUDE: crsuse2-m2m-v3-010,crsuse2-m2m-v3-022,crsuse2-m2m-v3-060,crsuse2-m2m-v3-123
        run: bash .github/workflows/scripts/spur/launch.sh --gpus "${{ inputs.num_gpus }}"

      - name: Cancel cluster jobs on failure/cancel
        if: failure() || cancelled()
        continue-on-error: true
        shell: bash
        run: |
          # Same prefix launch.sh names its jobs with. %200j widens the name
          # column; Spur's squeue does not accept --me.
          PREFIX="miles-ci-${RUNNER_NAME}-${GITHUB_RUN_ID}-"
          JOBS=$(squeue --noheader --format="%i %200j" | grep -F "$PREFIX" | awk '{print $1}' || true)
          if [ -n "$JOBS" ]; then
            echo "Cancelling: $JOBS"
            scancel $JOBS
          fi
