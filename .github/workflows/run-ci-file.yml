name: Rerun Test
run-name: "/rerun-test ${{ inputs.test_file }} (PR #${{ inputs.pull_number }})"

# Fixed default-branch orchestration for /rerun-test <test-file>. The reviewed
# resolver chooses the plan before an execution job checks out the exact PR
# head and invokes that file as PR-controlled code. Fork heads are accepted
# (the gateway gates who may request them); their runs receive no repository
# secrets, matching the pr-test fork policy.

on:
  workflow_dispatch:
    inputs:
      pull_number:
        description: 'Pull request number this file run belongs to (audit and concurrency only).'
        required: true
        type: string
      head_sha:
        description: 'Exact PR head SHA selected by the comment gateway.'
        required: true
        type: string
      test_file:
        description: 'Registered test file to run, e.g. tests/e2e/precision/test_hf_attention_cp_relayout.py.'
        required: true
        type: string
      hw:
        description: 'Hardware backend (auto keeps the CPU/CUDA default; rocm selects AMD).'
        required: false
        type: choice
        options: [auto, rocm]
        default: auto
      ci_megatron_pr:
        description: 'Megatron-LM branch/commit pin forwarded from the PR body (empty: miles-main).'
        required: false
        type: string
        default: ''
      ci_megatron_bridge_pr:
        description: 'Megatron Bridge PR (#N), branch, tag, or commit (empty: keep the existing installation).'
        required: false
        type: string
        default: ''
      ci_sglang_pr:
        description: 'SGLang branch/commit pin forwarded from the PR body (empty: sglang-miles).'
        required: false
        type: string
        default: ''
      ci_image_tag:
        description: 'Image tag forwarded from the PR body (defaults to the default CI image).'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: run-ci-file-${{ inputs.pull_number }}-${{ inputs.test_file }}${{ inputs.hw == 'rocm' && '-rocm' || '' }}
  cancel-in-progress: false
  queue: max

jobs:
  # The run owns its own status comment: it is the only party that knows when
  # execution starts, how long it takes, and how it ends. Announcing here
  # (rather than from the gateway's reply) also covers direct dispatches.
  announce-file-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      comment_id: ${{ steps.announce.outputs.comment_id }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out the trusted reporter
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/scripts/comment_ci_command.py
          sparse-checkout-cone-mode: false

      - name: Announce the file run on its pull request
        id: announce
        env:
          CI_COMMAND_API_TOKEN: ${{ github.token }}
          CI_COMMAND_FILE_RUN_STATUS: announce
          FILE_RUN_PULL_NUMBER: ${{ inputs.pull_number }}
          FILE_RUN_TEST_FILE: ${{ inputs.test_file }}
          FILE_RUN_RUN_ID: ${{ github.run_id }}
        run: python3 .github/workflows/scripts/comment_ci_command.py

  resolve-file-run:
    needs: announce-file-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      hw: ${{ steps.resolve.outputs.hw }}
      num_gpus: ${{ steps.resolve.outputs.num_gpus }}
      suite: ${{ steps.resolve.outputs.suite }}
      runs_on: ${{ steps.resolve.outputs.runs_on }}
      container_image: ${{ steps.resolve.outputs.container_image }}
      timeout_seconds: ${{ steps.resolve.outputs.timeout_seconds }}
      rocm_timeout: ${{ steps.resolve.outputs.rocm_timeout }}
      execute_command: ${{ steps.resolve.outputs.execute_command }}
      head_is_fork: ${{ steps.head-repo.outputs.head_is_fork }}
    steps:
      - name: Validate dispatch inputs
        shell: bash
        env:
          PULL_NUMBER: ${{ inputs.pull_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          TEST_FILE: ${{ inputs.test_file }}
        run: |
          [[ "$PULL_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::pull_number must be numeric"; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head_sha must be a 40-hex SHA"; exit 1; }
          # The charset below keeps the path safe to interpolate into the
          # suite jobs' execute_command shell lines; the gateway enforces the
          # same shape, and this re-check covers direct dispatches.
          [[ "$TEST_FILE" =~ ^tests/(e2e|fast|fast-gpu|ci)(/[A-Za-z0-9_][A-Za-z0-9_.-]*)*/test_[A-Za-z0-9_][A-Za-z0-9_.-]*\.py$ ]] \
            || { echo "::error::test_file must be a registered tests/ path: $TEST_FILE"; exit 1; }

      - name: Resolve the head repository from the pull request
        id: head-repo
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: |
          # The live PR, not a dispatch input, decides fork-ness: fork heads
          # run without repository secrets, matching the pr-test fork policy.
          head_is_fork=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL_NUMBER}" \
            --jq 'if .head.repo.id == .base.repo.id then "false" else "true" end')
          echo "head_is_fork=${head_is_fork}" >> "$GITHUB_OUTPUT"

      - name: Check out the trusted resolver
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check out the requested head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.head_sha }}
          path: pr-source
          persist-credentials: false

      # CUDA retains authenticated lookup. ROCm checks Docker Hub anonymously;
      # only a not-found response falls back to the released image.
      - name: Login to Docker Hub
        if: inputs.hw != 'rocm' && inputs.ci_image_tag == ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Prefer a published PR image unless the body explicitly pins a tag.
      - name: Pick the image tag when the PR body did not pin one
        id: image
        env:
          CI_IMAGE_TAG: ${{ inputs.ci_image_tag }}
          PULL_NUMBER: ${{ inputs.pull_number }}
          CI_HW: ${{ inputs.hw }}
        run: |
          set -euo pipefail
          if [ -n "${CI_IMAGE_TAG}" ]; then
            echo "tag=${CI_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
            echo "Using the pinned tag ${CI_IMAGE_TAG}."
            exit 0
          fi
          PR_IMAGE_TAG="pr-${PULL_NUMBER}"
          DEFAULT_TAG=dev
          if [ "$CI_HW" = rocm ]; then
            PR_IMAGE_TAG=$(python3 -S .github/workflows/scripts/rocm_pr_image.py "$PULL_NUMBER")
            echo "tag=${PR_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if docker buildx imagetools inspect "${GITHUB_REPOSITORY}:${PR_IMAGE_TAG}" >/dev/null 2>&1; then
            echo "tag=${PR_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
            echo "Using this PR's image ${PR_IMAGE_TAG}."
          else
            echo "tag=${DEFAULT_TAG}" >> "$GITHUB_OUTPUT"
            echo "No ${PR_IMAGE_TAG} image is published; using the released default."
          fi

      - name: Resolve the file's execution plan
        id: resolve
        env:
          TEST_FILE: ${{ inputs.test_file }}
          CI_HW: ${{ inputs.hw }}
          CI_IMAGE_TAG: ${{ steps.image.outputs.tag }}
          CI_SOURCE_ROOT: ${{ github.workspace }}/pr-source
        run: python3 -S -m tests.ci.file_run

  run-cuda-file:
    needs: resolve-file-run
    if: needs.resolve-file-run.outputs.hw == 'cuda'
    concurrency:
      # B200 reruns share the host lock; other runs must not reacquire their parent group.
      group: ${{ endsWith(needs.resolve-file-run.outputs.suite, '-b200') && 'b200-oma' || format('run-ci-file-execution-{0}-{1}', inputs.pull_number, inputs.test_file) }}
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/_run-ci.yml
    with:
      ref: ${{ inputs.head_sha }}
      plan_already_resolved: true
      runs_on: ${{ needs.resolve-file-run.outputs.runs_on }}
      num_gpus: ${{ fromJSON(needs.resolve-file-run.outputs.num_gpus) }}
      timeout_minutes: ${{ needs.resolve-file-run.outputs.suite == 'stage-c-4-gpu-b200' && 540 || 360 }}
      container_image: ${{ needs.resolve-file-run.outputs.container_image }}
      # Release policy admits nightly/long files but never writes baselines. As in
      # stage runs, run_suite enforces the per-file timeout around the test alone.
      execute_command: >-
        python3 tests/ci/run_suite.py --hw cuda
        --suite '${{ needs.resolve-file-run.outputs.suite }}'
        --test-file '${{ inputs.test_file }}'
        --cadence release
        --timeout-per-file '${{ needs.resolve-file-run.outputs.timeout_seconds }}'
    secrets:
      WANDB_API_KEY: ${{ needs.resolve-file-run.outputs.head_is_fork != 'true' && secrets.WANDB_API_KEY || '' }}
      NEON_DATABASE_URL: ${{ needs.resolve-file-run.outputs.head_is_fork != 'true' && secrets.NEON_DATABASE_URL || '' }}

  run-rocm-file:
    needs: resolve-file-run
    if: needs.resolve-file-run.outputs.hw == 'rocm'
    concurrency:
      group: rocm-file-run
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/_run-ci-rocm.yml
    with:
      ref: ${{ inputs.head_sha }}
      plan_already_resolved: true
      runs_on: ${{ needs.resolve-file-run.outputs.runs_on }}
      num_gpus: ${{ fromJSON(needs.resolve-file-run.outputs.num_gpus) }}
      container_image: ${{ needs.resolve-file-run.outputs.container_image }}
      withhold_runner_secrets: ${{ needs.resolve-file-run.outputs.head_is_fork == 'true' }}
      execute_command: ${{ needs.resolve-file-run.outputs.execute_command }}
    secrets:
      AMD_WANDB_API_KEY: ${{ needs.resolve-file-run.outputs.head_is_fork != 'true' && secrets.AMD_WANDB_API_KEY || '' }}
      AMD_NEON_DATABASE_URL: ${{ needs.resolve-file-run.outputs.head_is_fork != 'true' && secrets.AMD_NEON_DATABASE_URL || '' }}

  run-cpu-file:
    needs: resolve-file-run
    if: needs.resolve-file-run.outputs.hw == 'cpu'
    uses: ./.github/workflows/_run-cpu-ci.yml
    with:
      ref: ${{ inputs.head_sha }}
      plan_already_resolved: true
      execute_command: >-
        timeout --signal=TERM --kill-after=30s
        '${{ needs.resolve-file-run.outputs.timeout_seconds }}s'
        pytest '${{ inputs.test_file }}' -v -x
    secrets:
      HF_TOKEN: ${{ needs.resolve-file-run.outputs.head_is_fork != 'true' && secrets.HF_TOKEN || '' }}

  # No `if` beyond always(): a resolver failure, a cancelled run, and a failing
  # test must all reach the pull request, or a silent run reads as a pass.
  report-file-run:
    needs: [announce-file-run, resolve-file-run, run-cuda-file, run-cpu-file, run-rocm-file]
    if: always()
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the trusted reporter
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/scripts/comment_ci_command.py
          sparse-checkout-cone-mode: false

      - name: Report the file run's result on its pull request
        env:
          CI_COMMAND_API_TOKEN: ${{ github.token }}
          CI_COMMAND_FILE_RUN_STATUS: report
          FILE_RUN_COMMENT_ID: ${{ needs.announce-file-run.outputs.comment_id }}
          FILE_RUN_PULL_NUMBER: ${{ inputs.pull_number }}
          FILE_RUN_TEST_FILE: ${{ inputs.test_file }}
          FILE_RUN_RUN_ID: ${{ github.run_id }}
          FILE_RUN_SUITE: ${{ needs.resolve-file-run.outputs.suite }}
          FILE_RUN_RESOLVE_RESULT: ${{ needs.resolve-file-run.result }}
          FILE_RUN_CUDA_RESULT: ${{ needs.run-cuda-file.result }}
          FILE_RUN_CPU_RESULT: ${{ needs.run-cpu-file.result }}
          FILE_RUN_ROCM_RESULT: ${{ needs.run-rocm-file.result }}
          FILE_RUN_ROCM_TIMEOUT: ${{ needs.resolve-file-run.outputs.rocm_timeout }}
        run: python3 .github/workflows/scripts/comment_ci_command.py
