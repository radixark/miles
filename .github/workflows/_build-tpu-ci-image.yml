# Reusable: the TPU CI image for `ref`, keyed by what builds docker/build.py's `tpu` variant.
#
# It is the image docker-build.yml publishes as radixark/miles:dev-tpu, built from the same Dockerfile and variant
# build args, but for the commit under test: a PR that changes the TPU image runs on its own image. A CI pod checks
# out the commit under test over the image's /root/miles (.github/tpu-ci/smoke.sh), so a change to miles' code
# reuses the image and only a change to its inputs builds a new one, on Cloud Build as tpu-ci (keyless WIF), pushed
# to sglang-torchtpu's CI registry in the TPU nodes' region.
name: _build-tpu-ci-image

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
    outputs:
      image:
        description: "Image reference the TPU pods run"
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: sglang-torchtpu
  AR_IMAGE: us-central1-docker.pkg.dev/sglang-torchtpu/sglang-torchtpu-ci/miles-tpu
  WIF_PROVIDER: projects/180183988733/locations/global/workloadIdentityPools/github/providers/github-oidc-v2
  CI_SA: tpu-ci@sglang-torchtpu.iam.gserviceaccount.com

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SA }}
          # a plain tpu-ci access token for the REST calls below
          token_format: access_token
          create_credentials_file: false

      - uses: google-github-actions/setup-gcloud@v2

      - id: build
        env:
          CI_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          INPUT_REF: ${{ inputs.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          tokfile="${RUNNER_TEMP}/tpu-ci.token"
          printf '%s' "$CI_ACCESS_TOKEN" > "$tokfile"
          trap 'rm -f "$tokfile"' EXIT

          # build.py owns the variant's Dockerfile and build args, as for docker-build.yml's dev-tpu builds
          pip3 install -q --break-system-packages typer
          variant=$(cd docker && python3 -c 'import build, json; print(json.dumps(build.VARIANTS["tpu"], sort_keys=True))')
          dockerfile=$(jq -r '.dockerfile' <<< "$variant")
          build_args=$(jq -r '.build_args | to_entries | map("--build-arg=\(.key)=\(.value)") | join(" ")' <<< "$variant")

          # The files docker-build.yml rebuilds dev-tpu for, the variant's config, and this build's own recipe.
          hash=$( (sha256sum "$dockerfile" docker/install-kube-tools.sh docker/tpu_patch/* requirements.txt \
            .github/tpu-ci/cloudbuild.yaml; echo "$variant") | sha256sum | head -c 16)
          tag="ci-${hash}"

          # Tags only: describing an image also queries Container Analysis, which tpu-ci cannot read. A failed
          # lookup (e.g. the package does not exist yet) counts as a miss and builds.
          if cached=$(gcloud artifacts docker tags list "$AR_IMAGE" --filter="tag~'/tags/${tag}$'" \
              --format='value(tag)' --project "$GCP_PROJECT" --access-token-file="$tokfile"); then
            :
          else
            echo "::warning::tag lookup failed; building ${tag}"
            cached=""
          fi
          if [ -n "$cached" ]; then
            echo "${AR_IMAGE}:${tag} exists; reusing it"
            echo "image=${AR_IMAGE}:${tag}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "${AR_IMAGE}:${tag} not found; building it on Cloud Build"
          commit=$(git rev-parse HEAD)
          bucket="${GCP_PROJECT}_cloudbuild"
          object="source/miles-${tag}-${RUN_ID}.tgz"
          src="${RUNNER_TEMP}/source.tgz"
          tar --exclude=./.git -czf "$src" -C "$GITHUB_WORKSPACE" .
          gcloud storage cp "$src" "gs://${bucket}/${object}" --project "$GCP_PROJECT" --access-token-file="$tokfile"
          # run_cloudbuild.py streams the build log here, retries one intermittent failure (e.g. a registry
          # pull), and prints only the pushed digest on stdout
          digest=$(python3 .github/tpu-ci/run_cloudbuild.py \
            --project "$GCP_PROJECT" --config .github/tpu-ci/cloudbuild.yaml \
            --bucket "$bucket" --object "$object" --tag "$tag" --token-file "$tokfile" \
            --substitutions "_IMAGE=${AR_IMAGE}" "_MILES_COMMIT=${commit}" "_DOCKERFILE=${dockerfile}" \
            "_BUILD_ARGS=${build_args}" \
            --timeout 3600s --max-attempts 2)
          echo "built ${AR_IMAGE}@${digest} for ${INPUT_REF}"
          echo "image=${AR_IMAGE}@${digest}" >> "$GITHUB_OUTPUT"
