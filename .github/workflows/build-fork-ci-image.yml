# doc-dev: docs/developer/ci/02-docker-build.md
name: Build Fork CI Image
run-name: fork-ci-image-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}

on:
  workflow_run:
    workflows: [PR Test]
    types: [in_progress]

permissions:
  contents: read

jobs:
  request:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.id != github.event.repository.id
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      request: ${{ steps.resolve.outputs.request }}
      pr: ${{ steps.resolve.outputs.pr }}
      merge_sha: ${{ steps.resolve.outputs.merge_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Wait for the attempt-bound build request
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/workflows/scripts/fork_ci_image.py resolve

  build:
    needs: request
    if: needs.request.outputs.request != ''
    runs-on: [docker-build]
    timeout-minutes: 180
    concurrency:
      group: fork-ci-image-${{ needs.request.outputs.pr }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      REQUEST_JSON: ${{ needs.request.outputs.request }}
      PR_NUMBER: ${{ needs.request.outputs.pr }}
      PYTHONPATH: ''
    steps:
      - name: Checkout trusted orchestration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout the frozen build context
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.request.outputs.merge_sha }}
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare isolated image output
        id: paths
        run: |
          DOCKER_CONFIG="$RUNNER_TEMP/fork-ci-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          OCI_OUTPUT="$RUNNER_TEMP/fork-ci-oci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$DOCKER_CONFIG" "$OCI_OUTPUT"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          echo "OCI_OUTPUT=$OCI_OUTPUT" >> "$GITHUB_ENV"
      - name: Install build tools
        run: |
          if ! command -v skopeo >/dev/null || ! command -v pip3 >/dev/null; then
            apt-get -o DPkg::Lock::Timeout=600 update
            apt-get -o DPkg::Lock::Timeout=600 install -y skopeo python3-pip
          fi
          PIP_BSP=""
          pip3 install --help | grep -q -- --break-system-packages && PIP_BSP="--break-system-packages"
          pip3 install $PIP_BSP --ignore-installed typer
      - name: Free idle build cache
        run: docker builder prune -af --filter "until=48h"
      - name: Set up isolated BuildKit
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Replace the action's default network.host/security.insecure entitlements.
          buildkitd-flags: --oci-worker-net=bridge
          driver-opts: image=moby/buildkit:latest
      - name: Validate source, CUDA demand, and CPU gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 trusted/.github/workflows/scripts/fork_ci_image.py check-source --source source
      - name: Build without registry credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 trusted/.github/workflows/scripts/fork_ci_image.py build --source source
      - name: Remove the builder before introducing publishing credentials
        if: always() && steps.buildx.outcome == 'success'
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: docker buildx rm "$BUILDER_NAME"
      - name: Recheck the live PR before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 trusted/.github/workflows/scripts/fork_ci_image.py check-current --source source
      - name: Login to Docker Hub for publication
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the PR image without executing it
        run: |
          skopeo copy --all --retry-times 3 --authfile "$DOCKER_CONFIG/config.json" \
            "oci:${OCI_OUTPUT}" "docker://radixark/miles:pr-${PR_NUMBER}"
      - name: Verify both architectures and consume the rebuild label
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 trusted/.github/workflows/scripts/fork_ci_image.py finish --source source
      - name: Remove local image output and credentials
        if: always() && steps.paths.outcome == 'success'
        run: rm -rf -- "$OCI_OUTPUT" "$DOCKER_CONFIG"
