name: Wheel smoke

# The built wheel, installed without Megatron, must import and parse args for FSDP and torchtitan.
# SGLang stays a source tree on PYTHONPATH until a hosted sglang-miles wheel exists.
# release-wheel.yml calls this on the tagged commit and publishes the dist it checked.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      ref:
        description: 'Commit to build (defaults to the triggering ref)'
        required: false
        type: string
        default: ''
      version:
        description: 'Exact release version to stamp into setup.py before the build (rc and post tags share its base version)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  wheel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout miles
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve dependency refs
        id: resolve-refs
        uses: ./.github/actions/resolve-dependency-refs
        with:
          pr_body: ${{ github.event.pull_request.body || '' }}

      - name: Checkout sglang
        uses: actions/checkout@v4
        with:
          repository: sgl-project/sglang
          ref: ${{ steps.resolve-refs.outputs.ci_sglang_pr }}
          path: sglang

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match the Miles Docker runtime.
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # the build runs setup.py from a dispatched ref; a cache it could write must not reach main
          enable-cache: false

      - name: Stamp the release version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          BASE_VERSION=$(echo "$VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          grep -q "version=\"${BASE_VERSION}\"" setup.py \
            || { echo "::error::setup.py does not carry version=\"${BASE_VERSION}\""; grep -n 'version="' setup.py; exit 1; }
          sed -i "s/version=\"${BASE_VERSION}\"/version=\"${VERSION}\"/" setup.py

      - name: Build the sdist and the wheel from it
        shell: bash
        run: uv build --out-dir "$RUNNER_TEMP/dist" .

      - uses: actions/upload-artifact@v4
        with:
          name: miles-dist
          path: ${{ runner.temp }}/dist

      - name: Install the wheel into a clean environment
        shell: bash
        run: |
          # torch follows sglang's pin (torchtitan needs >=2.13), torchvision follows torch
          python3 -c "import tomllib; deps = tomllib.load(open('sglang/python/pyproject.toml', 'rb'))['project']['dependencies']; print(next(d for d in deps if d.startswith('torch==')))" \
            > "$RUNNER_TEMP/overrides.txt"
          echo torchvision >> "$RUNNER_TEMP/overrides.txt"
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          VIRTUAL_ENV="$RUNNER_TEMP/venv" uv pip install \
            "$(ls "$RUNNER_TEMP"/dist/miles-*-py3-none-any.whl)[torchtitan]" \
            -r tests/ci/requirements-ci-cpu.txt \
            --override "$RUNNER_TEMP/overrides.txt"

      - name: Run the smoke check from outside the checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ github.workspace }}/sglang/python
        run: '"$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/tests/ci/wheel_smoke.py" "$GITHUB_WORKSPACE"'
