        /args/raw_megatron/base_args/eval_global_batch_size: 8
        /args/raw_megatron/base_args/expert_tensor_parallel_size: 2
        /args/raw_megatron/base_args/ffn_hidden_size: 9728
        /args/raw_megatron/base_args/finetune: false
