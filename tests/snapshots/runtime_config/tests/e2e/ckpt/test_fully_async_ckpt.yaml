        /args/raw_megatron/base_args/pipeline_model_parallel_size: 2
        /args/raw_megatron/base_args/tensor_model_parallel_size: 2
        /args/raw_megatron/base_args/tokenizer_model: /root/models/Qwen3-4B/
        /args/raw_megatron/base_args/transformer_pipeline_model_parallel_size: 2
