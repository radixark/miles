# Source: miles-run/templates/trainer-engines.yaml
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: "myrun-miles-run-trainer-engine-actor"
  namespace: "myns"
  labels:
    helm.sh/chart: "miles-run-0.1.0"
    app.kubernetes.io/name: "miles-run"
    app.kubernetes.io/instance: "myrun"
    app.kubernetes.io/component: "trainer-engine-actor"
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: "Helm"
spec:
  replicas: 1
  startupPolicy: LeaderCreated
  leaderWorkerTemplate:
    size: 4
    restartPolicy: RecreateGroupOnPodRestart
    workerTemplate:
      metadata:
        labels:
          helm.sh/chart: "miles-run-0.1.0"
          app.kubernetes.io/name: "miles-run"
          app.kubernetes.io/instance: "myrun"
          app.kubernetes.io/component: "trainer-engine-actor"
          app.kubernetes.io/version: "0.1.0"
          app.kubernetes.io/managed-by: "Helm"
          miles.radixark.io/pool: "trainer-engine-actor"
        annotations:
          miles.radixark.io/meta-gpu_ids: "0,1,2,3,4,5,6,7"
      spec:
        enableServiceLinks: false
        imagePullSecrets:
          - name: "myregistry-pull-secret"
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
        tolerations:
          - effect: NoSchedule
            key: nvidia.com/gpu
            operator: Exists
        hostIPC: true
        containers:
          - name: "trainer"
            image: "myregistry.example/myteam/miles:v0.9.3-cu128"
            imagePullPolicy: "IfNotPresent"
            volumeMounts:
              - name: shared-storage
                mountPath: "/cluster-storage"
              - name: shared-storage
                mountPath: "/root/miles"
                subPath: "myuser/miles"
              - name: shared-storage
                mountPath: "/root/Megatron-LM"
                subPath: "myuser/Megatron-LM"
              - name: node-local
                mountPath: "/scratch"
            command:
              - "bash"
              - "-c"
              - "mkdir -p /scratch/Qwen3-4B && rsync -a --info=progress2 /cluster-storage/models/Qwen3-4B/ /scratch/Qwen3-4B && exec <PYTHON> -m miles.utils.workers.process_supervisor --num-subprocesses 8 -- <PYTHON> -m miles.utils.workers.serving.serve --worker miles.backends.megatron_utils.actor.MegatronTrainRayActor --pool-id trainer-engine-actor --ctor-kwargs-fn miles.ray.specs.bootstrap.compute_ctor_kwargs --ranks-per-pod 8 --gpu-slots-per-rank 1 -- --cluster-backend kubernetes --rollout-num-gpus 48"
            env:
              - name: MILES_CELL_INDEX
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['leaderworkerset.sigs.k8s.io/group-index']
              - name: "CUDA_DEVICE_MAX_CONNECTIONS"
                value: "1"
              - name: "HF_ENDPOINT"
                value: "https://hf-mirror.example"
              - name: "LD_PRELOAD"
                value: "/usr/local/lib/python3.12/dist-packages/torch_memory_saver_hook_mode_preload_cu13.abi3.so"
              - name: "MILES_K8S_NAMESPACE"
                value: "myns"
              - name: "MILES_K8S_RELEASE"
                value: "myrun"
              - name: "NCCL_CUMEM_ENABLE"
                value: "0"
              - name: "NCCL_IB_HCA"
                value: "mlx5_0,mlx5_1"
              - name: "NCCL_SOCKET_IFNAME"
                value: "bond0"
              - name: "NVSHMEM_DISABLE_NCCL"
                value: "1"
              - name: "NVTE_FP8_BLOCK_SCALING_FP32_SCALES"
                value: "1"
              - name: "PYTHONPATH"
                value: "<REPO_ROOT>:/root/Megatron-LM"
              - name: "PYTHONUNBUFFERED"
                value: "1"
              - name: "RAY_EXPERIMENTAL_NOSET_ASCEND_RT_VISIBLE_DEVICES"
                value: "1"
              - name: "RAY_EXPERIMENTAL_NOSET_CUDA_VISIBLE_DEVICES"
                value: "1"
              - name: "RAY_EXPERIMENTAL_NOSET_HABANA_VISIBLE_MODULES"
                value: "1"
              - name: "RAY_EXPERIMENTAL_NOSET_HIP_VISIBLE_DEVICES"
                value: "1"
              - name: "RAY_EXPERIMENTAL_NOSET_NEURON_RT_VISIBLE_CORES"
                value: "1"
              - name: "RAY_EXPERIMENTAL_NOSET_ONEAPI_DEVICE_SELECTOR"
                value: "1"
              - name: "RAY_EXPERIMENTAL_NOSET_TPU_VISIBLE_CHIPS"
                value: "1"
              - name: "TMS_INIT_ENABLE"
                value: "1"
              - name: "TMS_INIT_ENABLE_CPU_BACKUP"
                value: "1"
            ports:
              - name: "master"
                containerPort: 9000
              - name: "rpc"
                containerPort: 8000
            resources:
              limits:
                nvidia.com/gpu: 8
        volumes:
          - name: shared-storage
            persistentVolumeClaim:
              claimName: "miles-shared-nvme"
          - name: node-local
            hostPath:
              path: "/mnt/local-nvme/miles-staging"
              type: DirectoryOrCreate
