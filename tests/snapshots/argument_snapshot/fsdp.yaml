        help: Run multiple continuous decoding steps to reduce scheduling overhead. This can potentially increase throughput
          but may also increase time-to-first-token latency. The default value is 1, meaning only run one decoding step at
          a time.
        option_strings:
        - --sglang-num-continuous-decode-steps
        type:
          $callable: builtins.int
      - default: 1
        dest: sglang_scheduler_recv_interval
        group: options
        help: The interval to poll requests in scheduler. Can be set to >1 to reduce the overhead of this.
        option_strings:
        - --sglang-scheduler-recv-interval
        type:
          $callable: builtins.int
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_enable_mixed_chunk
        group: options
        help: Enabling mixing prefill and decode in a batch when using chunked prefill.
        nargs: 0
        option_strings:
        - --sglang-enable-mixed-chunk
        type: null
      - default: null
        dest: sglang_dist_timeout
