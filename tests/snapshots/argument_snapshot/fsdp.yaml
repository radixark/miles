        dest: stream_optimizer_state_to_disk
        group: options
        help: 'Hold optimizer state in files on node-local NVMe, for when it does not fit the GPU *while the step runs*; --offload-train-target=disk
          cannot help there.

          adam: streams fp32 main params and moments through per-bucket files, one bucket resident at a time. Requires the
          distributed optimizer, excludes --offload-optimizer-states and --optimizer-cpu-offload.

          dist_muon: the disk backend for --chunked-optimizer-state-offload, so pass that plus a non-zero --optimizer-state-offload-fraction.
