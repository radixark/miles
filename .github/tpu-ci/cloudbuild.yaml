# Cloud Build: build docker/build.py's `tpu` variant into the TPU CI image and push it to sglang-torchtpu's CI
# registry. .github/workflows/_build-tpu-ci-image.yml reads the variant's Dockerfile and build args from build.py
# (this step's Python is too old to run it), stages the source and runs this through run_cloudbuild.py.
substitutions:
  _IMAGE: "us-central1-docker.pkg.dev/sglang-torchtpu/sglang-torchtpu-ci/miles-tpu"
  _TAG: "latest"
  # the commit the image's /root/miles is cloned at; CI pods check out the commit under test over it
  _MILES_COMMIT: "main"
  _DOCKERFILE: "docker/Dockerfile.tpu"
  # space-separated --build-arg=KEY=VALUE flags
  _BUILD_ARGS: ""

serviceAccount: "projects/sglang-torchtpu/serviceAccounts/tpu-ci@sglang-torchtpu.iam.gserviceaccount.com"

# GCS copy of the build log, which run_cloudbuild.py streams into the Actions job log: most contributors cannot
# open the project's Cloud Console. LEGACY keeps the console log view working too.
logsBucket: "gs://sglang-torchtpu_cloudbuild/logs"

options:
  logging: LEGACY
  machineType: E2_HIGHCPU_8
  # the sglang-torchtpu release image the Dockerfile starts from is tens of GB unpacked
  diskSizeGb: 200

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    # BuildKit sets TARGETARCH, which docker/install-kube-tools.sh needs
    env: ["DOCKER_BUILDKIT=1"]
    entrypoint: bash
    args:
      - -c
      # _BUILD_ARGS is left unquoted to split into its flags
      - >-
        docker build -f "${_DOCKERFILE}" ${_BUILD_ARGS} --build-arg "MILES_COMMIT=${_MILES_COMMIT}"
        -t "${_IMAGE}:${_TAG}" .

images:
  - "${_IMAGE}:${_TAG}"
