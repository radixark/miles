# doc-dev: docs/developer/ci/00-stage.md
name: B200 CI

on:
  workflow_call:
    inputs:
      container_image:
        type: string
        required: true
      ref:
        description: 'Git ref to check out (empty = the triggering commit).'
        type: string
        required: false
        default: ''
      cadence:
        type: string
        required: true
      raw_labels:
        type: string
        required: true
      match_all_labels:
        type: boolean
        required: false
        default: false
      run_8_gpu:
        type: boolean
        required: true
      run_4_gpu:
        type: boolean
        required: true
    secrets:
      WANDB_API_KEY:
        required: false
      NEON_DATABASE_URL:
        required: false

permissions:
  contents: read

# Hold the whole host across both layouts; file reruns use the same group.
concurrency:
  group: b200-oma
  cancel-in-progress: false
  queue: max

jobs:
  stage-c-8-gpu-b200:
    if: inputs.run_8_gpu
    uses: ./.github/workflows/_run-ci.yml
    with:
      runs_on: '["b200", "8gpu"]'
      # Whole-node shards cannot overlap; avoid repeated environment setup.
      timeout_minutes: 540
      container_image: ${{ inputs.container_image }}
      ref: ${{ inputs.ref }}
      execute_command: >-
        python tests/ci/run_suite.py --hw cuda --suite stage-c-8-gpu-b200
        --cadence ${{ inputs.cadence }}
        --labels ${{ inputs.raw_labels }}
        ${{ inputs.match_all_labels && '--match-all-labels' || '' }}
    secrets: inherit

  stage-c-4-gpu-b200:
    needs: stage-c-8-gpu-b200
    if: ${{ !cancelled() && inputs.run_4_gpu }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        partition_id: [0, 1, 2, 3]
    uses: ./.github/workflows/_run-ci.yml
    with:
      runs_on: '["b200", "4gpu"]'
      # An absorbed long test alone has a 7.5-hour per-file timeout.
      timeout_minutes: 540
      container_image: ${{ inputs.container_image }}
      ref: ${{ inputs.ref }}
      execute_command: >-
        python tests/ci/run_suite.py --hw cuda --suite stage-c-4-gpu-b200
        --auto-partition-id ${{ matrix.partition_id }} --auto-partition-size 4
        --cadence ${{ inputs.cadence }}
        --labels ${{ inputs.raw_labels }}
        ${{ inputs.match_all_labels && '--match-all-labels' || '' }}
    secrets: inherit
