polar_agent_cli_dir: ${AGENT_CLI_DIR}
polar_callback_host: 127.0.0.1
polar_gateway_url: http://127.0.0.1:8100
polar_max_async_level: 2
polar_min_complete_accept_fraction: 0.6
polar_request_timeout: 1800
polar_reward_key: score
polar_rollout_url: http://127.0.0.1:8080
polar_task_id_template: polar-xyne-qa-grpo-{rollout_id}-{sample.group_index}
# Runtime credentials/endpoints are supplied by polar_credentials.env before
# launching the Miles job. Keep secrets out of this YAML and out of source control.
polar_xyne_base_url: ${XYNE_BASE_URL}
polar_xyne_api_key: ${XYNE_API_KEY}
polar_judge_base_url: ${XYNE_JUDGE_BASE_URL}
polar_judge_api_key: ${JUSPAY_API_KEY}
polar_judge_model: ${XYNE_JUDGE_MODEL}
polar_judge_max_tokens: ${XYNE_JUDGE_MAX_TOKENS}
polar_judge_max_concurrency: ${XYNE_JUDGE_MAX_CONCURRENCY}
polar_task_template:
  group_reward:
    strategy: quality_conditioned_token_efficiency
    weight: 0.03
    input_weight: 0.02
  agent:
    env:
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      # Keep this a string even when no preset token is exported. The Polar
      # harness mints a session token from ACCESS_TOKEN_SECRET when empty.
      XYNE_ACCESS_TOKEN: "${XYNE_ACCESS_TOKEN}"
      DATABASE_HOST: localhost
      DATABASE_PORT: '15432'
      DATABASE_URL: postgresql://xyne:xyne@localhost:15432/xyne?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      LITELLM_API_KEY: dummy-polar-gateway
      LITELLM_BASE_URL: http://127.0.0.1:8100
      LITELLM_BEST_AGENTIC_MODEL: nemotron
      LITELLM_BEST_MODEL: nemotron
      LITELLM_FAST_MODEL: nemotron
      LITELLM_SQL_INFERENCE_MODEL: nemotron
      NODE_ENV: production
      HOST: http://localhost:3001
      GOOGLE_PROD_REDIRECT_URI: http://localhost:3001/v1/auth/callback
      VESPA_FEED_PORT: '18080'
      VESPA_HOST: localhost
      VESPA_QUERY_PORT: '18081'
      VESPA_REQUIRED: 'false'
    import_path: polar.xyne.harness:XyneHarness
    model_name: nemotron-30b-a3b
    settings:
      api_key: '{args.polar_xyne_api_key}'
      base_url: http://localhost:3000
      boot_port: '3000'
      health_interval_sec: 2
      health_timeout_sec: 120
      server_dir: /workspace/xyne/server/server
      env_source: /dev/null
      auth_email: ${XYNE_AUTH_EMAIL}
      auth_role: ${XYNE_AUTH_ROLE}
      auth_workspace: ${XYNE_AUTH_WORKSPACE}
      agent_id: ${XYNE_AGENT_ID}
      skip_boot: true
  builder:
    # Flatten every captured main-agent/subagent completion into its own
    # training sequence. Each trace retains the cumulative request context,
    # while only that completion's sampled response tokens receive loss.
    strategy: per_request
  evaluator:
    config:
      expected_doc_ids: '{sample.metadata.doc_ids}'
      expected_chunk_ids: '{sample.metadata.chunk_ids}'
      reference_answer: '{sample.metadata.answer}'
      judge:
        base_url: ${XYNE_JUDGE_BASE_URL}
        api_key: ${JUSPAY_API_KEY}
        model: ${XYNE_JUDGE_MODEL}
        timeout: 60
        max_tokens: ${XYNE_JUDGE_MAX_TOKENS}
        max_concurrency: ${XYNE_JUDGE_MAX_CONCURRENCY}
        dimension_weights:
          quality: 1.0
          correctness: 2.0
          groundedness: 1.5
          citation_accuracy: 1.5
      scorers:
      - name: llm_judge
        weight: 3.0
      - method: f1
        name: embedding_similarity
        reference_answer: '{sample.metadata.answer}'
        weight: 2.0
      - exact_weight: 0.5
        name: gold_evidence_coverage
        vespa_document_url: http://127.0.0.1:18080
        weight: 2.0
      - exact_weight: 0.5
        name: citation_evidence_coverage
        vespa_document_url: http://127.0.0.1:18080
        weight: 2.0
      - coverage_weight: 0.75
        exact_weight: 0.5
        name: tool_evidence_utility
        vespa_document_url: http://127.0.0.1:18080
        weight: 1.0
    strategy: polar.xyne.evaluator:XyneCompositeEvaluator
  runtime:
    backend: docker
    import_path: polar.runtime.local:LocalRuntime
    env:
      HOME: /polar/session/home
      PATH: /opt/node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    image: ${XYNE_RUNTIME_IMAGE}
    kwargs:
      volumes:
      - '{args.polar_agent_cli_dir}:/opt/node:ro'
      - '{args.polar_xyne_server_dir}:/workspace/xyne/server:rw'
    network: host
    prepare:
    - command: mkdir -p /polar/session/logs/agent /polar/session/home
      type: exec
    workdir: /polar/session
  timeout_seconds: 1800
polar_xyne_server_dir: ${XYNE_SERVER_DIR}
