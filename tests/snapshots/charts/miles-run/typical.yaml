          restartPolicy: Never
          containers:
            - name: uninstall
              image: "myregistry.example/myteam/miles:v0.9.3-cu128"
              imagePullPolicy: "IfNotPresent"
              command:
                - sh
                - -c
                - "sleep 120 && helm uninstall myrun --namespace myns --ignore-not-found"

