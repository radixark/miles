# 2-node smoke of prod_2node_gateway_4b.yaml: the same recipe and layout (1 training node at TP 1 x CP 1 x DP 8,
# 1 rollout node of 8 SGLang engines, 8 prompts x 32 samples, 512 episodes in flight, 64k per episode) for 5 steps,
# with retries 0 and no checkpoints. It measures what the prod run would see: step time, how long the trainer waits
# for rollouts, and per-GPU memory on real long trajectories.
exp_name: tmax_smoke_4b_2node
model_name: Qwen3.5-4B-tmax-template          # hamishivi/Qwen3.5-4B, its patched chat template
sandbox_backend: gateway                      # containers on the fleet behind beaker.gateway_registry
num_nodes: 2
num_gpus_per_node: 8
async_rollout_gpus: 8                         # the second node: 8 SGLang engines, one GPU each
rollout_batch_size: 8
n_samples_per_prompt: 32
num_rollout: 5
max_seq_len: 67584
rollout_max_response_len: 16384
max_steps: 64
filter_zero_std: true
max_weight_staleness: 4
async_max_concurrent_samples: 512             # 64 episodes per engine
async_data_buffer_capacity_factor: 4
tensor_model_parallel_size: 1                 # the 4B trains a full 64k trajectory per GPU: no TP, no CP, DP 8
context_parallel_size: 1
max_tokens_per_gpu: 67584
optimizer_cpu_offload: false
sglang_mem_fraction_static: 0.8
sandbox_start_concurrency: 64
start_failure: drop
save_interval: 1000
extra_args: "--log-probs-backend fused --distributed-timeout-minutes 120 --sglang-watchdog-timeout 1800"
model_dir: /weka/nora-default/shashankg/miles_tmax_v2/models
data_dir: /weka/nora-default/shashankg/miles_tmax_v2/datasets
output_dir: /weka/nora-default/shashankg/miles_tmax_v2/output
trace_dir: /weka/oe-adapt-default/allennlp/deletable_rollouts/miles
dump_training_data: true

beaker:
  cluster: ai2/holmes
  workspace: ai2/oe-agents-holmes
  budget: ai2/oe-omai
  priority: urgent
  preemptible: false
  min_runtime: 8h
  retries: 0
  nodes: 2
  gpus: 8
  shared_memory: 512GiB
  image: docker.io/radixark/miles:dev-202610151741
  dockerhub_username: shashankg209
  gateway_registry: head+sqlite:///weka/oe-adapt-default/gfaria/primebeaker/registries/podman-private-reasoning-20261017.sqlite3
  gateway_min_replicas: 64                    # 512 sandboxes / 8 per replica
  env:
    NCCL_DEBUG: WARN
