# Namespace isolation policy for Miles Kubernetes CI.
# Allows full intra-namespace pod/service communication (CoreDNS *.svc:18080,
# NCCL, Mooncake, sglang router/engine RPC), kube-system DNS, and external HTTPS,
# while blocking cloud metadata access and cross-namespace pod traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: miles-ci-k8s-isolation
  namespace: miles-ci-k8s
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 5432
