processes:
  tests/e2e/sglang_config/test_sglang_config/run-0000/all/default/actor_cell00000:
    diffs:
      checkpoint_load-0000:
        set:
          <<:
          - &id001
            /args/backend/ckpt_step: null
            /args/backend/load: /root/models/Qwen2.5-0.5B-Instruct/
            /load: /root/models/Qwen2.5-0.5B-Instruct/
            /local_checkpoint_manager: false
          - &id002
            /args/backend/lr_decay_iters: 3
            /args/backend/model_type: {$enum: megatron.core.enums.ModelType, name: encoder_or_decoder}
            /args/backend/train_iters: 3
          /args/backend/finetune: false
          /args/backend/no_load_optim: null
          /args/backend/no_load_rng: null
      checkpoint_load-0001:
        set:
          <<:
          - *id001
          - *id002
          /args/backend/finetune: true
          /args/backend/no_load_optim: true
          /args/backend/no_load_rng: true
      train_first_step-0000:
        set:
          <<: *id002
          /role: actor
    ranks: [0, 1, 2, 3, 4, 5, 6, 7]
    template: trainer-megatron-02
  tests/e2e/sglang_config/test_sglang_config/run-0000/all/default/inference_controller:
    diffs: &id007
      router_endpoints-0000:
        set:
          <<: &id004
            /args/sglang_model_routers: {default: {$tuple: [$HOST, $PORT]}}
            /args/sglang_router_ip: $HOST
            /args/sglang_router_port: $PORT
    overrides:
      set:
        <<:
        - &id005
          /args/config_snapshot_name: tests/e2e/sglang_config/test_sglang_config/run-0000
          /args/eval_max_response_len: 1024
          /args/eval_prompt_data: [gsm8k, /root/datasets/gsm8k/test.parquet]
          /args/eval_top_k: 1
          /args/hf_checkpoint: /root/models/Qwen2.5-0.5B-Instruct/
          /args/init_expected_num_cells/default: 8
          /args/megatron_to_hf_mode: bridge
          /args/n_samples_per_prompt: 4
          /args/num_rollout: 3
          /args/prompt_data: /root/datasets/gsm8k/train.parquet
          /args/ref_load: /root/models/Qwen2.5-0.5B-Instruct/
          /args/rm_type: math
          /args/sglang/base_args/cuda_graph_max_bs_decode: 32
          /args/sglang/base_args/enable_metrics: true
          /args/sglang/base_args/mem_fraction_static: 0.6
          /args/sglang/models:
          - model_path: null
            name: default
            server_groups:
            - &id003
              needs_offload: true
              num_gpus_per_engine: 1
              overrides: {model_path: /root/models/Qwen2.5-0.5B-Instruct/}
              worker_type: {$enum: miles.backends.sglang_utils.sglang_api_client.WorkerType, name: REGULAR}
            - *id003
            update_weights: true
          /args/start_rollout_id: null
        - &id006
          /args/eval_interval: 20
          /args/log_probs_max_tokens_per_gpu: 9216
          /args/max_tokens_per_gpu: 9216
          /args/num_layers: 24
          /args/rollout_max_response_len: 1024
          /args/rollout_temperature: 0.8
          /args/use_kl_loss: true
          /args/wandb_project: miles-test_sglang_config
    template: inference_controller-01
  tests/e2e/sglang_config/test_sglang_config/run-0000/all/default/main:
    diffs:
      router_endpoints-0000:
        set:
          <<: *id004
          /args/wandb_run_id: $WANDB_RUN_ID_0000
      tracking_config-0000: {set: {/args/wandb_run_id: $WANDB_RUN_ID_0000}}
    overrides:
      set:
        <<:
        - *id005
        - *id006
        - &id008
          /args/raw_megatron/base_args/add_qkv_bias: true
          /args/raw_megatron/base_args/data_parallel_size: 8
          /args/raw_megatron/base_args/encoder_num_layers: 24
          /args/raw_megatron/base_args/eval_global_batch_size: 32
          /args/raw_megatron/base_args/eval_interval: 20
          /args/raw_megatron/base_args/ffn_hidden_size: 4864
          /args/raw_megatron/base_args/finetune: false
          /args/raw_megatron/base_args/global_batch_size: 32
          /args/raw_megatron/base_args/hidden_size: 896
          /args/raw_megatron/base_args/kv_channels: 64
          /args/raw_megatron/base_args/load: null
          /args/raw_megatron/base_args/no_load_optim: null
          /args/raw_megatron/base_args/no_load_rng: null
          /args/raw_megatron/base_args/num_attention_heads: 14
          /args/raw_megatron/base_args/num_layers: 24
          /args/raw_megatron/base_args/num_query_groups: 2
          /args/raw_megatron/base_args/padded_vocab_size: 151936
          /args/raw_megatron/base_args/qk_layernorm: false
          /args/raw_megatron/base_args/recompute_granularity: null
          /args/raw_megatron/base_args/recompute_method: null
          /args/raw_megatron/base_args/recompute_num_layers: null
          /args/raw_megatron/base_args/sequence_parallel: false
          /args/raw_megatron/base_args/tensor_model_parallel_size: 1
          /args/raw_megatron/base_args/tokenizer_model: /root/models/Qwen2.5-0.5B-Instruct/
          /args/raw_megatron/base_args/untie_embeddings_and_output_weights: false
          /args/raw_megatron/base_args/wandb_project: miles-test_sglang_config
          /args/raw_megatron/base_args/world_size: 8
    template: main-01
  tests/e2e/sglang_config/test_sglang_config/run-0000/all/default/rollout_executor:
    diffs: *id007
    overrides:
      set:
        <<:
        - *id005
        - *id006
        - *id008
        - &id009
          /args/dynamic_sampling_filter_path: miles.rollout.filter_hub.dynamic_sampling_filters.check_reward_nonzero_std
          /args/eval_datasets:
          - custom_generate_function_path: null
            input_key: messages
            label_key: label
            max_response_len: 1024
            metadata_key: metadata
            metadata_overrides: {}
            min_new_tokens: null
            n_samples_per_eval_prompt: 1
            name: gsm8k
            path: /root/datasets/gsm8k/test.parquet
            rm_type: null
            stop: null
            stop_token_ids: null
            temperature: 0.8
            tool_key: tools
            top_k: 1
            top_p: 1.0
          /args/over_sampling_batch_size: 16
    template: rollout_executor-01
  tests/e2e/sglang_config/test_sglang_config/run-0000/all/default/trainer_controller_actor: {overrides: {set: {/args/backend/rank: 0}},
    template: trainer-megatron-02}
  tests/e2e/sglang_config/test_sglang_config/run-0000/all/default/worker_manager:
    overrides:
      set:
        <<:
        - *id005
        - *id006
        - *id008
        - *id009
        /args/actor_num_gpus_per_node: 8
        /args/rollout_num_gpus: 8
        /args/sglang_scaling/groups/default:
        - {engine_offset: 0, gpu_offset: 0, num_gpus: 4}
        - {engine_offset: 4, gpu_offset: 4, num_gpus: 4}
    template: worker_manager-01
