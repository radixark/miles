          split dynamically between sub-pools. Requires the Triton attention / linear-attn / Mamba backends. PD disaggregation
          is supported over mooncake at equal attention TP with pp=1; not yet compatible with hierarchical / host-tiered KV
          cache, prefill cuda-graph capture, or speculative decoding other than DSPARK.
        nargs: 0
        option_strings:
        - --sglang-enable-unified-memory
        type: null
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_disable_chunked_prefix_cache
        group: options
        help: Disable chunked prefix cache feature for deepseek, which should save overhead for short sequences.
        nargs: 0
        option_strings:
        - --sglang-disable-chunked-prefix-cache
        type: null
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_disable_overlap_schedule
        group: options
        help: Disable the overlap scheduler, which overlaps the CPU scheduler with GPU model worker.
        nargs: 0
        option_strings:
        - --sglang-disable-overlap-schedule
        type: null
      - default: 1
