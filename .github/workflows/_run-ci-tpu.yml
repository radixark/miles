# Reusable: run one scripts/tpu launcher's recipe on a TPU v7x 2x2x1 host of sglang-torchtpu's CI cluster and gate
# on its exit code. .github/tpu-ci/README.md describes the setup.
name: _run-ci-tpu

on:
  workflow_call:
    inputs:
      ref:
        description: "miles commit the pod checks out over the image's copy"
        required: true
        type: string
      image:
        description: "radixark/miles:dev-tpu, or the PR's pr-<number>-tpu"
        required: true
        type: string
      launcher:
        description: "scripts/tpu/run_<launcher>_torchtitan.py"
        required: true
        type: string
      recipe:
        required: false
        type: string
        default: smoke
      # the JobSet's deadline: model download, both compiles and the recipe's steps
      timeout_minutes:
        required: true
        type: number
      queue:
        description: "Kueue LocalQueue in the tpu-ci namespace"
        required: false
        type: string
        default: tpu-prgate-1h

permissions:
  contents: read
  id-token: write

env:
  GKE_ZONE: us-central1-c
  GKE_CLUSTER: tpu-cluster
  WIF_PROVIDER: projects/180183988733/locations/global/workloadIdentityPools/github/providers/github-oidc-v2
  CI_SA: tpu-ci@sglang-torchtpu.iam.gserviceaccount.com

jobs:
  run:
    name: ${{ inputs.launcher }}
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub's cap for hosted runners
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Run on TPU
        env:
          # inputs reach the scripts through the environment, never by template substitution into the shell
          IN_IMAGE: ${{ inputs.image }}
          IN_LAUNCHER: ${{ inputs.launcher }}
          IN_RECIPE: ${{ inputs.recipe }}
          IN_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
          IN_QUEUE: ${{ inputs.queue }}
          RUN_LABEL: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          deadline_s=$((IN_TIMEOUT_MINUTES * 60))
          python3 .github/tpu-ci/render_jobset.py \
            --image "$IN_IMAGE" \
            --sha "$(git rev-parse HEAD)" \
            --launcher "$IN_LAUNCHER" \
            --recipe "$IN_RECIPE" \
            --queue "$IN_QUEUE" \
            --deadline-s "$deadline_s" \
            --run-label "$RUN_LABEL" > "$RUNNER_TEMP/jobset.json"
          # outlast the JobSet's deadline, which restarts when a scale-up outlasts Kueue's 5-minute PodsReady wait
          bash .github/tpu-ci/run_jobset.sh "$RUNNER_TEMP/jobset.json" "${IN_LAUNCHER} (${IN_RECIPE})" \
            $((deadline_s + 1800))

      # a cancelled step may die before its trap deletes the JobSet, and the kubeconfig token may be past its hour
      - name: Refresh cluster credentials
        if: cancelled()
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Delete this run's JobSets
        if: cancelled()
        env:
          RUN_LABEL: ${{ github.run_id }}-${{ github.run_attempt }}
        run: kubectl -n tpu-ci delete jobsets -l "miles-ci-run=${RUN_LABEL}" --ignore-not-found --wait=false || true
