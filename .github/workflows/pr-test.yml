name: B200 scheduling benchmark
run-name: B200 ${{ inputs.layout }} benchmark ${{ inputs.round }}
on:
  workflow_dispatch:
    inputs:
      layout:
        type: choice
        options: [serial, parallel, probe4, probe8, envprobe]
        required: true
      round:
        type: string
        required: true
      ci_sglang_pr:
        type: string
        default: b84bec5761a6cdc8b1df86b9b89ead80a7a9bb02
      ci_megatron_pr:
        type: string
        default: fd15ee20a4f03b03680529baf4b8f7eeed64df1d
permissions:
  contents: read
concurrency:
  group: ${{ (startsWith(inputs.layout, 'probe') || inputs.layout == 'envprobe') && format('b200-probe-{0}', github.run_id) || 'b200-oma' }}
  cancel-in-progress: false
  queue: max
jobs:
  serial:
    if: inputs.layout == 'serial'
    uses: ./.github/workflows/_run-ci.yml
    with:
      runs_on: '["b200", "8gpu"]'
      ref: ${{ github.sha }}
      plan_already_resolved: true
      container_image: radixark/miles@sha256:58b75eaf0ae6a66ee2ed966bede9e6ef8a42a1942588f2692172c3d879b4f67c
      execute_command: python tests/ci/b200_benchmark.py --test all --gpus 8
    secrets: inherit
  parallel:
    if: inputs.layout == 'parallel'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        test: [sft, lora]
    uses: ./.github/workflows/_run-ci.yml
    with:
      runs_on: '["b200", "4gpu"]'
      ref: ${{ github.sha }}
      plan_already_resolved: true
      container_image: radixark/miles@sha256:58b75eaf0ae6a66ee2ed966bede9e6ef8a42a1942588f2692172c3d879b4f67c
      execute_command: python tests/ci/b200_benchmark.py --test ${{ matrix.test }} --gpus 4
    secrets: inherit
  probe:
    if: startsWith(inputs.layout, 'probe')
    runs-on: ${{ inputs.layout == 'probe4' && fromJSON('["b200", "4gpu"]') || fromJSON('["b200", "8gpu"]') }}
    timeout-minutes: 15
    container:
      image: radixark/miles@sha256:58b75eaf0ae6a66ee2ed966bede9e6ef8a42a1942588f2692172c3d879b4f67c
      options: --gpus all --env CUDA_VISIBLE_DEVICES
    steps:
      - name: Hold real CUDA contexts until cancellation
        env:
          EXPECTED_GPUS: ${{ inputs.layout == 'probe4' && '4' || '8' }}
        run: |
          python -u - <<'PYCODE'
          import json, os, threading, time
          import torch
          count = torch.cuda.device_count()
          assert count == int(os.environ['EXPECTED_GPUS'])
          tensors = [torch.ones(1024, device=f'cuda:{i}') for i in range(count)]
          assert all(t.sum().item() == 1024 for t in tensors)
          print('PROBE_READY ' + json.dumps({'gpus': count, 'cvd': os.environ['CUDA_VISIBLE_DEVICES'], 'timestamp': time.time()}), flush=True)
          threading.Event().wait(300 if count == 4 else 1)
          PYCODE

  envprobe:
    if: inputs.layout == 'envprobe'
    runs-on: [b200-hook-probe]
    timeout-minutes: 5
    container:
      image: radixark/miles@sha256:58b75eaf0ae6a66ee2ed966bede9e6ef8a42a1942588f2692172c3d879b4f67c
      options: --gpus all --env CUDA_VISIBLE_DEVICES
    steps:
      - name: Verify hook environment reaches job steps without CUDA allocation
        run: |
          python - <<'PYCODE'
          import os, torch
          assert os.environ['CUDA_VISIBLE_DEVICES'] == '7,3', os.environ['CUDA_VISIBLE_DEVICES']
          assert torch.cuda.device_count() == 2
          assert not torch.cuda.is_initialized()
          print('ENV_PROBE_PASS: dynamic CUDA_VISIBLE_DEVICES=7,3; count=2; no CUDA context')
          PYCODE
