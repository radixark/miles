        group: options
        help: DWDP (Distributed Weight Data Parallelism) group size. When > 1, MoE prefill uses weight prefetch instead of
          token all-to-all. Must equal tp_size. Only supported with --disaggregation-mode null or prefill.
        option_strings:
        - --sglang-dwdp-size
        type:
          $callable: builtins.int
      - choices:
          $set:
          - a2a
          - ag_rs
          - fi_a2a
        default: null
        dest: sglang_dcp_comm_backend
        group: options
        help: 'Communication backend for the decode context-parallel (DCP) attention reduction: ''ag_rs'' (AllGather + ReduceScatter),
          ''a2a'' (fused NCCL All-to-All exchange of output+LSE + local Triton LSE combine), or ''fi_a2a'' (FlashInfer MNNVL
          All-to-All kernel; requires Blackwell and a DCP group within one MNNVL domain). Unset resolves to ''fi_a2a'' where
          supported, else ''a2a'' on CUDA/ROCm, else ''ag_rs''.'
        option_strings:
        - --sglang-dcp-comm-backend
        type:
          $callable: builtins.str
      - action:
          $callable: argparse.BooleanOptionalAction
        default: null
        dest: sglang_dcp_replicate_q_proj
        group: options
        help: 'For MLA decode context parallelism with the a2a/fi_a2a backend: replicate the Q projection so each DCP rank
          computes the full-head query locally (redundant projection compute), eliminating the per-layer head-dim all-gather
          of Q. Trades a small amount of extra GEMM for one fewer collective per layer. Use --no-dcp-replicate-q-proj to disable
          the model-specific default.'
        nargs: 0
        option_strings:
        - --sglang-dcp-replicate-q-proj
        - --no-sglang-dcp-replicate-q-proj
        type: null
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_enable_prefill_cp
        group: options
        help: Enable context parallelism for the prefill phase. Select the layout with --cp-strategy.
        nargs: 0
        option_strings:
        - --sglang-enable-prefill-cp
        type: null
      - choices:
          $set:
          - interleave
          - zigzag
        default: null
        dest: sglang_cp_strategy
        group: options
        help: Sharding strategy for prefill CP. 'zigzag' assigns each rank one early and one late sequence block; 'interleave'
          assigns token indices modulo the CP size.
        option_strings:
        - --sglang-cp-strategy
        type:
          $callable: builtins.str
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_enable_dsa_cache_layer_split
        group: options
        help: Split DSA (DeepSeek Sparse Attention) GPU KV/indexer cache layers across context-parallel ranks to reduce per-rank
          KV memory. Currently only supported with the mooncake transfer backend (mooncake / mooncake_tcp); mori/nixl support
          will be added later by the community.
        nargs: 0
        option_strings:
        - --sglang-enable-dsa-cache-layer-split
        type: null
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_enable_cp_decode_attn_tp
        group: options
        help: Enable attention tensor-parallel weight slicing during decode under context parallel (cp_size>1). Slices the
          replicated attention linears to the local CP partition, eliminating redundant decode GEMMs.
        nargs: 0
        option_strings:
        - --sglang-enable-cp-decode-attn-tp
        type: null
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_enable_dp_attention
        group: options
        help: Enabling data parallelism for attention and tensor parallelism for FFN. The dp size should be equal to the tp
          size. Currently DeepSeek-V2 and Qwen 2/3 MoE models are supported.
        nargs: 0
        option_strings:
        - --sglang-enable-dp-attention
        type: null
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_enable_dp_attention_local_control_broadcast
        group: options
        help: With DP-attention, send control messages to every DP group leader and broadcast within attn_tp_group instead
          of the full tp_group. Eliminates a costly all-ranks gloo sync on every scheduler iteration.
        nargs: 0
        option_strings:
        - --sglang-enable-dp-attention-local-control-broadcast
        type: null
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_enable_dp_lm_head
        group: options
        help: Enable vocabulary parallel across the attention TP group to avoid all-gather across DP groups, optimizing performance
          under DP attention.
        nargs: 0
        option_strings:
        - --sglang-enable-dp-lm-head
        type: null
      - action:
          $callable: argparse.BooleanOptionalAction
        default: null
        dest: sglang_enable_tp_lm_head_all_to_all
        group: options
        help: Use all-to-all instead of TP all-gather followed by DP scatter for the TP-sharded LM head under DP attention.
          By default this is enabled only on decode-only PD nodes with pure DP attention (tp_size == dp_size > 1 and attn_cp_size
          == 1), and disabled on prefill-only and colocated nodes. Pass --no-enable-tp-lm-head-all-to-all to opt out. The
          path is incompatible with --enable-dp-lm-head; batches without an equal padded row count fall back to the existing
          all-gather path.
        nargs: 0
        option_strings:
        - --sglang-enable-tp-lm-head-all-to-all
        - --no-sglang-enable-tp-lm-head-all-to-all
        type: null
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_enable_attn_tp_input_scattered
        group: options
        help: Allow input of attention to be scattered when only using tensor parallelism, to reduce the computational load
          of operations such as qkv latent.
        nargs: 0
        option_strings:
        - --sglang-enable-attn-tp-input-scattered
        type: null
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_enable_shared_experts_attn_tp
        group: options
        help: Shard shared expert weights across the attention TP group when using an expert-parallel all-to-all backend.
        nargs: 0
        option_strings:
        - --sglang-enable-shared-experts-attn-tp
        type: null
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_enable_dense_mlp_attn_tp
        group: options
        help: Shard dense MLP weights across the attention TP group under DP attention.
        nargs: 0
        option_strings:
        - --sglang-enable-dense-mlp-attn-tp
        type: null
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_enable_layernorm_sp
        group: options
        help: 'Enable Megatron-style sequence parallelism (arXiv:2205.05198) for the LayerNorm/residual regions under pure
          tensor parallelism: the row-parallel all-reduce becomes reduce-scatter + all-gather, so LayerNorm runs on sequence-sharded
          activations with no extra communication volume. Prefill only; Qwen3 dense; requires tp_size > 1 and NVLink/NVSwitch.'
        nargs: 0
        option_strings:
        - --sglang-enable-layernorm-sp
        type: null
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_disable_attn_tp_gather
        group: options
        help: Disable scheduler-side attn_tp_gather (the upstream SP path that pads num_tokens to attn_tp_size and pre-allocates
          a gathered buffer). Use for models that manage SP scatter/gather at the model level (e.g., perform their own all_gather/reduce_scatter
          inside attention) and do not consume the upstream gathered_buffer. Without this, the cuda graph runner pads num_tokens
          to attn_tp_size, which can cause kernel autotuners to select wrong-sized variants at small batches.
        nargs: 0
        option_strings:
        - --sglang-disable-attn-tp-gather
        type: null
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_enable_p2p_check
        group: options
        help: Enable P2P check for GPU access, otherwise the p2p access is allowed by default.
        nargs: 0
        option_strings:
        - --sglang-enable-p2p-check
        type: null
      - default: null
        dest: sglang_device
        group: options
        help: The device to use ('cuda', 'xpu', 'hpu', 'npu', 'cpu', 'musa'). Defaults to auto-detection if not specified.
        option_strings:
        - --sglang-device
        type:
          $callable: builtins.str
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_mlx_enable_sampling
        group: options
        help: 'MLX backend only: sample decode tokens (temperature / top-k / top-p / min-p) instead of greedy argmax. Sampling
          runs inside the lazy MLX graph, so it works with the overlap scheduler; first tokens from prefill/extend are sampled
          too. Greedy requests keep exact argmax behavior. Also enables on the MLX path: grammar vocab masks and custom logit
          processors (these break decode chaining per step; custom processors run on pure-decode steps only), logit_bias,
          output logprobs (sampled token / top-k / token_ids; prompt input logprobs are not computed), NaN sanitization (SGLANG_SANITIZE_NAN_LOGITS),
          and per-request sampling_seed under --enable-deterministic-inference (deterministic within MLX only). Penalties
          are not applied.'
        nargs: 0
        option_strings:
        - --sglang-mlx-enable-sampling
        type: null
      - default: 300
        dest: sglang_watchdog_timeout
        group: options
        help: Set watchdog timeout in seconds. If a forward batch takes longer than this, the server will crash to prevent
          hanging.
        option_strings:
        - --sglang-watchdog-timeout
        type:
          $callable: builtins.float
      - default: null
        dest: sglang_soft_watchdog_timeout
        group: options
