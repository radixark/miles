# Beaker spec for the TMax smoke tests (4 GPUs). Edit the checkout path, TMAX_CACHE_DIR, MODE,
# budget, cluster and secret names for your account, then:
#   beaker experiment create --workspace ai2/oe-agents-holmes examples/tmax/beaker/tmax_smoke.yaml
version: v2
description: Miles TMax Terminal-RL smoke test
budget: ai2/oe-omai
tasks:
  - name: miles-tmax-smoke
    image:
      docker: docker.io/radixark/miles:latest
    command: [bash, /weka/nora-default/shashankg/code/miles/examples/tmax/beaker/tmax_smoke.sh]
    datasets:
      - mountPath: /weka/nora-default
        source:
          weka: nora-default
    envVars:
      - {name: MODE, value: sync}  # sync | async | opd | opd-async
      - {name: TMAX_CACHE_DIR, value: /weka/nora-default/shashankg/miles_tmax}
      - {name: BEAKER_ALLOW_SUBCONTAINERS, value: "1"}
      - {name: BEAKER_SKIP_DOCKER_SOCKET, value: "1"}
      - {name: DOCKERHUB_USERNAME, value: shashankg209}
      - {name: PYTORCH_ALLOC_CONF, value: "expandable_segments:True"}
      - {name: DOCKER_PAT, secret: shashankg_DOCKER_PAT}
      - {name: HF_TOKEN, secret: shashankg_HF_TOKEN}
      - {name: WANDB_API_KEY, secret: shashankg_WANDB_API_KEY}
    resources:
      gpuCount: 4
      sharedMemorySize: 256GiB
    context:
      priority: urgent
      minRuntime: 8h
    constraints:
      cluster: [ai2/holmes]
