# RBAC for the in-cluster GitHub Actions runner and the orphan reaper.
#
# Two namespaces keep the runner credential away from workflow code:
# - miles-ci-k8s-runner holds the runner Deployment, its ServiceAccount, and the
#   `github-runner-app-creds` Secret. Nothing else runs there.
# - miles-ci-k8s holds every workload a CI job creates (the driver Job and the
#   Helm releases it installs).
#
# runner-launcher lives in miles-ci-k8s-runner and is bound to a Role in
# miles-ci-k8s that manages batch/v1 Jobs and reads Pods, logs, and Events.
# A Job it creates can only select a ServiceAccount of miles-ci-k8s, and no
# Role in miles-ci-k8s reaches the Secrets of miles-ci-k8s-runner, so no
# ServiceAccount a driver Job can run as reads the runner credential.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner-launcher
  namespace: miles-ci-k8s-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runner-launcher
  namespace: miles-ci-k8s
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runner-launcher
  namespace: miles-ci-k8s
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runner-launcher
subjects:
  - kind: ServiceAccount
    name: runner-launcher
    namespace: miles-ci-k8s-runner
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: miles-ci-reaper
  namespace: miles-ci-k8s
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: miles-ci-reaper
  namespace: miles-ci-k8s
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods", "services", "serviceaccounts", "configmaps"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["leaderworkerset.x-k8s.io"]
    resources: ["leaderworkersets"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: miles-ci-reaper
  namespace: miles-ci-k8s
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: miles-ci-reaper
subjects:
  - kind: ServiceAccount
    name: miles-ci-reaper
    namespace: miles-ci-k8s
