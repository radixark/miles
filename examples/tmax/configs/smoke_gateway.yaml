# 4-GPU smoke test (async) with sandboxes on a LiteRegistry podman fleet instead of podman in the job
# (sandbox_backend: gateway, tmax_gateway.py): 3 steps of 4 prompts x 4 samples on a 64-prompt subset, 16k per episode.
# With 4 samples Qwen3.5 solves a task on every sample or none, so the zero-variance filter is off.
exp_name: tmax_smoke_gateway
async_rollout_gpus: 2
sandbox_backend: gateway                      # containers on the fleet behind beaker.gateway_registry
num_gpus_per_node: 4
num_prompts: 64
rollout_batch_size: 4
n_samples_per_prompt: 4
num_rollout: 3
max_seq_len: 16384
tensor_model_parallel_size: 1
optimizer_cpu_offload: false
sglang_mem_fraction_static: 0.6
filter_zero_std: false
save_interval: 1000
episode_timeout_s: 3600
model_dir: /weka/nora-default/shashankg/miles_tmax_v2/models
data_dir: /weka/nora-default/shashankg/miles_tmax_v2/datasets
output_dir: /weka/nora-default/shashankg/miles_tmax_v2/output
trace_dir: /weka/oe-adapt-default/allennlp/deletable_rollouts/miles
dump_training_data: true

beaker:
  cluster: ai2/holmes
  workspace: ai2/oe-agents-holmes
  budget: ai2/oe-omai
  priority: urgent
  preemptible: false
  min_runtime: 8h
  retries: 0
  gpus: 4
  shared_memory: 256GiB
  image: docker.io/radixark/miles:dev-202610151741
  # The fleet's head registry: the head starts a gateway from it (weka bucket oe-adapt-default is mounted).
  gateway_registry: head+sqlite:///weka/oe-adapt-default/gfaria/primebeaker/registries/podman-terminal-jupiter-head.sqlite3
  dockerhub_username: shashankg209
