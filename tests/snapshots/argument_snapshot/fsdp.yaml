      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_sleep_on_idle
        group: options
        help: Reduce CPU usage when sglang is idle.
        nargs: 0
        option_strings:
        - --sglang-sleep-on-idle
        type: null
