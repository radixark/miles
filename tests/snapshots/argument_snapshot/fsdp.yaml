        nargs: 0
        option_strings:
        - --sglang-enable-multimodal
        type: null
      - default: null
        dest: sglang_revision
        group: options
        help: The specific model version to use. It can be a branch name, a tag name, or a commit id. If unspecified, will
          use the default version.
        option_strings:
        - --sglang-revision
        type:
          $callable: builtins.str
      - default: auto
        dest: sglang_model_impl
        group: options
        help: 'Which implementation of the model to use.


          * "auto" will try to use the SGLang implementation if it exists and fall back to the Transformers implementation
          if no SGLang implementation is available.

          * "sglang" will use the SGLang model implementation.

          * "transformers" will use the Transformers model * "mindspore" will use the MindSpore model implementation.

          '
        option_strings:
        - --sglang-model-impl
        type:
          $callable: builtins.str
      - default: auto
        dest: sglang_model_config_parser
        group: options
        help: Which model-config parser to use. "auto" picks "mistral" via the is_mistral_model name heuristic, else "hf"
          (AutoConfig over config.json). Plugins can register additional parsers via @register_model_config_parser.
        option_strings:
        - --sglang-model-config-parser
        type:
          $callable: builtins.str
      - default: '{}'
        dest: sglang_json_model_override_args
        group: options
        help: A dictionary in JSON string format used to override default model configurations.
        option_strings:
        - --sglang-json-model-override-args
        type:
          $callable: builtins.str
      - choices:
          $set:
          - auto
          - bfloat16
          - float
          - float16
          - float32
          - half
        default: auto
        dest: sglang_dtype
        group: options
        help: 'Data type for model weights and activations.


          * "auto" will use FP16 precision for FP32 and FP16 models, and BF16 precision for BF16 models.

          * "half" for FP16. Recommended for AWQ quantization.

          * "float16" is the same as "half".

          * "bfloat16" for a balance between precision and range.

          * "float" is shorthand for FP32 precision.

          * "float32" for FP32 precision.'
        option_strings:
        - --sglang-dtype
        type:
          $callable: builtins.str
      - choices:
          $set:
          - auto-round
          - auto-round-int8
          - awq
          - awq_marlin
          - bitsandbytes
          - compressed-tensors
          - fp8
          - gguf
          - gptq
          - gptq_marlin
          - humming
          - mlx_q4
          - mlx_q8
          - modelopt
          - modelopt_fp4
          - modelopt_fp8
          - modelopt_mixed
          - modelslim
          - moe_wna16
          - mxfp4
          - mxfp8
          - mxfp_w4a8
          - nvfp4_online
          - petit_nvfp4
          - quark
          - quark_int4fp8_moe
          - quark_mxfp4
          - unquant
          - w4afp8
          - w8a8_fp8
          - w8a8_int8
        default: null
        dest: sglang_quantization
        group: options
        help: The quantization method.
        option_strings:
        - --sglang-quantization
        type:
          $callable: builtins.str
      - default: null
        dest: sglang_quantization_param_path
        group: options
        help: 'Path to the JSON file containing the KV cache scaling factors. This should generally be supplied, when KV cache
          dtype is FP8. Otherwise, KV cache scaling factors default to 1.0, which may cause accuracy issues. '
        option_strings:
        - --sglang-quantization-param-path
        type:
          $callable: sglang.srt.utils.common.nullable_str
      - choices:
          $set:
          - auto
          - bf16
          - bfloat16
          - fp4_e2m1
          - fp4_mx_block16
          - fp8_e4m3
          - fp8_e5m2
          - mxfp8
          - nvfp4
        default: auto
        dest: sglang_kv_cache_dtype
        group: options
        help: Data type for kv cache storage. "auto" will use model data type. "bf16" or "bfloat16" for BF16 KV cache. "fp8_e5m2"
          and "fp8_e4m3" are supported for CUDA 11.8+. "mxfp8" is supported by the FA4 backend. "nvfp4" selects the NVFP4
          FP4 E2M1 KV cache recipe; "fp4_mx_block16" selects the MX-style block-size-16 FP4 E2M1 KV cache recipe. Both require
          CUDA 12.8+ and PyTorch 2.8.0+
        option_strings:
        - --sglang-kv-cache-dtype
        type:
          $callable: builtins.str
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_enable_fp32_lm_head
        group: options
        help: If set, the LM head outputs (logits) are in FP32.
        nargs: 0
        option_strings:
        - --sglang-enable-fp32-lm-head
        type: null
      - default: null
        dest: sglang_modelopt_quant
        group: options
        help: 'The ModelOpt quantization configuration. Supported values: ''fp8'', ''int4_awq'', ''w4a8_awq'', ''nvfp4'',
          ''nvfp4_awq''. This requires the NVIDIA Model Optimizer library to be installed: pip install nvidia-modelopt'
        option_strings:
        - --sglang-modelopt-quant
        type:
          $callable: builtins.str
      - default: null
        dest: sglang_modelopt_checkpoint_restore_path
        group: options
        help: Path to restore a previously saved ModelOpt quantized checkpoint. If provided, the quantization process will
          be skipped and the model will be loaded from this checkpoint.
        option_strings:
        - --sglang-modelopt-checkpoint-restore-path
        type:
          $callable: builtins.str
      - default: null
        dest: sglang_modelopt_checkpoint_save_path
        group: options
        help: Path to save the ModelOpt quantized checkpoint after quantization. This allows reusing the quantized model in
          future runs.
        option_strings:
        - --sglang-modelopt-checkpoint-save-path
        type:
          $callable: builtins.str
      - default: null
        dest: sglang_modelopt_export_path
        group: options
        help: Path to export the quantized model in HuggingFace format after ModelOpt quantization. The exported model can
          then be used directly with SGLang for inference. If not provided, the model will not be exported.
        option_strings:
        - --sglang-modelopt-export-path
        type:
          $callable: builtins.str
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_quantize_and_serve
        group: options
        help: Quantize the model with ModelOpt and immediately serve it without exporting. This is useful for development
          and prototyping. For production, it's recommended to use separate quantization and deployment steps.
        nargs: 0
        option_strings:
        - --sglang-quantize-and-serve
        type: null
      - default: null
        dest: sglang_rl_quant_profile
        group: options
        help: Path to the FlashRL quantization profile. Required when using --load-format flash_rl.
        option_strings:
        - --sglang-rl-quant-profile
        type:
          $callable: builtins.str
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_enable_tf32_matmul
        group: options
        help: Enable float32 matmuls to use TensorFloat32 precision for better performance (via torch.set_float32_matmul_precision).
          CUDA only.
        nargs: 0
        option_strings:
        - --sglang-enable-tf32-matmul
        type: null
      - default: null
        dest: sglang_mem_fraction_static
        group: options
        help: The fraction of the memory used for static allocation (model weights and KV cache memory pool). Use a smaller
          value if you see out-of-memory errors.
        option_strings:
        - --sglang-mem-fraction-static
        type:
          $callable: builtins.float
      - default: null
        dest: sglang_max_running_requests
        group: options
        help: The maximum number of running requests.
        option_strings:
        - --sglang-max-running-requests
        type:
          $callable: builtins.int
      - default: null
        dest: sglang_max_queued_requests
        group: options
        help: The maximum number of queued requests. This option is ignored when using disaggregation-mode.
        option_strings:
        - --sglang-max-queued-requests
        type:
          $callable: builtins.int
      - default: null
        dest: sglang_max_total_tokens
        group: options
        help: "The maximum number of tokens in the memory pool. If not specified, it will be automatically calculated based\
          \ on the memory usage fraction. This option is typically used for development and debugging purposes.\n\nSupports\
          \ standard SI suffixes (k, M, G, T) and IEC suffixes\n    (Ki, Mi, Gi, Ti). Suffixes are case-sensitive.\n\n   \
          \ Decimals are allowed for SI suffixes only.\n\n    Examples:\n        '1k' -> 1000      '1M' -> 1000000    '25.6k'\
          \ -> 25600\n        '1Ki' -> 1024     '1Mi' -> 1048576\n    "
        option_strings:
        - --sglang-max-total-tokens
        type:
          $callable: sglang.srt.utils.common.human_readable_int
      - default: null
        dest: sglang_chunked_prefill_size
        group: options
        help: The maximum number of tokens in a chunk for the chunked prefill. Setting this to -1 means disabling chunked
          prefill.
        option_strings:
        - --sglang-chunked-prefill-size
        type:
          $callable: builtins.int
      - default: null
        dest: sglang_prefill_decode_interval
        group: options
        help: The number of decode rounds to run after a prefill batch before scheduling the next prefill. By default, this
          is disabled except for profiled Qwen3-VL serving configurations on Hopper. In data-parallel attention mode, the
          interval is synchronized across all DP ranks. Set to 0 to disable.
        option_strings:
        - --sglang-prefill-decode-interval
        type:
          $callable: builtins.int
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_enable_dynamic_chunking
        group: options
        help: Enable dynamic chunk size adjustment for pipeline parallelism. When enabled, chunk sizes are dynamically calculated
          based on fitted function to maintain consistent execution time across chunks.
        nargs: 0
        option_strings:
        - --sglang-enable-dynamic-chunking
        type: null
      - default: 16384
        dest: sglang_max_prefill_tokens
        group: options
        help: "The maximum number of tokens in a prefill batch. The real bound will be the maximum of this value and the model's\
          \ maximum context length.\n\nSupports standard SI suffixes (k, M, G, T) and IEC suffixes\n    (Ki, Mi, Gi, Ti).\
          \ Suffixes are case-sensitive.\n\n    Decimals are allowed for SI suffixes only.\n\n    Examples:\n        '1k'\
          \ -> 1000      '1M' -> 1000000    '25.6k' -> 25600\n        '1Ki' -> 1024     '1Mi' -> 1048576\n    "
        option_strings:
        - --sglang-max-prefill-tokens
        type:
          $callable: sglang.srt.utils.common.human_readable_int
      - default: null
        dest: sglang_prefill_max_requests
        group: options
        help: The maximum number of requests in a prefill batch. If not specified, there is no limit.
        option_strings:
        - --sglang-prefill-max-requests
        type:
          $callable: builtins.int
      - choices:
          $set:
          - dfs-weight
          - fcfs
          - hrrn
          - lof
          - lpm
          - priority
          - random
          - routing-key
        default: fcfs
        dest: sglang_schedule_policy
        group: options
        help: The scheduling policy of the requests.
        option_strings:
        - --sglang-schedule-policy
        type:
          $callable: builtins.str
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_enable_priority_scheduling
        group: options
        help: Enable priority scheduling. Requests with higher priority integer values will be scheduled first by default.
        nargs: 0
        option_strings:
        - --sglang-enable-priority-scheduling
        type: null
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_disable_priority_preemption
        group: options
        help: Disable priority scheduling preemption.
        nargs: 0
        option_strings:
        - --sglang-disable-priority-preemption
        type: null
      - default: null
        dest: sglang_default_priority_value
        group: options
        help: Default priority for requests without explicit priority.
        option_strings:
        - --sglang-default-priority-value
        type:
          $callable: builtins.int
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_abort_on_priority_when_disabled
        group: options
        help: If set, abort requests that specify a priority when priority scheduling is disabled.
        nargs: 0
        option_strings:
        - --sglang-abort-on-priority-when-disabled
        type: null
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_schedule_low_priority_values_first
        group: options
        help: If specified with --enable-priority-scheduling, the scheduler will schedule requests with lower priority integer
          values first.
        nargs: 0
        option_strings:
        - --sglang-schedule-low-priority-values-first
        type: null
      - default: 10
        dest: sglang_priority_scheduling_preemption_threshold
        group: options
        help: Minimum difference in priorities for an incoming request to have to preempt running request(s).
        option_strings:
        - --sglang-priority-scheduling-preemption-threshold
        type:
          $callable: builtins.int
      - choices:
          $set:
          - length
          - priority
        default: length
        dest: sglang_retraction_policy
        group: options
        help: The decode retraction policy to use when the KV cache is full. 'length' preserves the existing behavior and
          retracts short-output, long-input requests first. 'priority' retracts lower-priority requests first, using the same
          priority direction as priority scheduling.
        option_strings:
        - --sglang-retraction-policy
        type:
          $callable: builtins.str
      - default: 1.0
        dest: sglang_schedule_conservativeness
        group: options
        help: How conservative the schedule policy is. A larger value means more conservative scheduling. Use a larger value
          if you see requests being retracted frequently.
        option_strings:
        - --sglang-schedule-conservativeness
        type:
          $callable: builtins.float
      - default: null
        dest: sglang_page_size
        group: options
        help: The number of tokens in a page.
        option_strings:
        - --sglang-page-size
        type:
          $callable: builtins.int
      - default: 16
        dest: sglang_c128_page_size
        group: options
        help: The physical page size of the NPU DSV4 C128 KV cache. Must be a positive multiple of 16.
        option_strings:
        - --sglang-c128-page-size
        type:
          $callable: builtins.int
      - default: null
        dest: sglang_swa_full_tokens_ratio
        group: options
        help: The ratio of SWA layer KV tokens / full layer KV tokens, regardless of the number of swa:full layers. It should
          be between 0 and 1. E.g. 0.5 means if each swa layer has 50 tokens, then each full layer has 100 tokens.
        option_strings:
        - --sglang-swa-full-tokens-ratio
        type:
          $callable: builtins.float
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_disable_hybrid_swa_memory
        group: options
        help: Disable the hybrid SWA memory pool.
        nargs: 0
        option_strings:
        - --sglang-disable-hybrid-swa-memory
        type: null
      - choices:
          $set:
          - lfu
          - lru
          - priority
          - slru
        default: lru
        dest: sglang_radix_eviction_policy
        group: options
        help: The eviction policy of radix trees. 'lru' stands for Least Recently Used, 'lfu' stands for Least Frequently
          Used, 'slru' stands for Segmented Least Recently Used, and 'priority' evicts lower-priority requests first. See
          https://docs.sglang.io/docs/advanced_features/radix_eviction_policy for what each policy optimizes for.
        option_strings:
        - --sglang-radix-eviction-policy
        type:
          $callable: builtins.str
      - default: null
        dest: sglang_radix_eviction_policy_config
        group: options
        help: 'Tuning parameters for --radix-eviction-policy, as a json object passed to the policy as keyword arguments.
          Only ''slru'' takes any today: protected_threshold (int, default 2), e.g. ''{"protected_threshold": 4}''. An unrecognized
          key fails at startup, naming the key and the policy. See https://docs.sglang.io/docs/advanced_features/radix_eviction_policy#policy-parameters
          for the full parameter list.'
        option_strings:
        - --sglang-radix-eviction-policy-config
        type:
          $callable: json.loads
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_prefill_only_disable_kv_cache
        group: options
        help: Skip the physical KV cache allocation for embedding-mode prefill-only workloads. Currently only valid with --is-embedding,
          --chunked-prefill-size=-1, --disable-radix-cache, an FA prefill backend, and non-FP4 KV cache so the fa_skip_kv_cache
          path is active (no layer reads or writes the cache). Other prefill-only workloads such as scoring/MIS may benefit
          from this later once their attention paths stop using paged KV. Scheduler admission accounting is unchanged; per-layer
          K/V tensors are sized to (page_size, head_num, head_dim) placeholders so GPU memory is not wasted.
        nargs: 0
        option_strings:
        - --sglang-prefill-only-disable-kv-cache
        type: null
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_disable_radix_cache
        group: options
        help: Disable RadixAttention for prefix caching.
        nargs: 0
        option_strings:
        - --sglang-disable-radix-cache
        type: null
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_enable_page_major_kv_layout
        group: options
        help: 'Enable the page-major KV layout: lay out the Mamba state and full/SWA KV caches in a page-granularity envelope
          (page is the outermost axis, layer-major within a page) instead of the default per-layer (layer-major) layout. Requires
          the Triton attention / linear-attn / Mamba backends.'
        nargs: 0
        option_strings:
        - --sglang-enable-page-major-kv-layout
        type: null
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: sglang_enable_unified_memory
        group: options
