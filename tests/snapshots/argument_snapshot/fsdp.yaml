        option_strings:
        - --sglang-tp-size
        - --sglang-tensor-parallel-size
        type:
          $callable: builtins.int
      - default: 1
        dest: sglang_dcp_size
        group: options
        help: The decode context parallelism size.
        option_strings:
        - --sglang-dcp-size
        - --sglang-decode-context-parallel-size
        type:
          $callable: builtins.int
      - default: 1
        dest: sglang_pp_size
        group: options
        help: The pipeline parallelism size.
        option_strings:
        - --sglang-pp-size
        - --sglang-pipeline-parallel-size
        type:
          $callable: builtins.int
      - default: null
        dest: sglang_pp_max_micro_batch_size
        group: options
        help: The maximum micro batch size in pipeline parallelism.
        option_strings:
        - --sglang-pp-max-micro-batch-size
        type:
          $callable: builtins.int
      - default: 0
        dest: sglang_pp_async_batch_depth
        group: options
        help: The async batch depth of pipeline parallelism.
        option_strings:
        - --sglang-pp-async-batch-depth
        type:
          $callable: builtins.int
      - default: 1
        dest: sglang_dp_size
        group: options
        help: The data parallelism size.
        option_strings:
        - --sglang-dp-size
        - --sglang-data-parallel-size
        type:
          $callable: builtins.int
      - choices:
          $set:
          - auto
          - follow_bootstrap_room
          - round_robin
          - total_requests
          - total_tokens
        default: auto
        dest: sglang_load_balance_method
        group: options
        help: The load balancing strategy for data parallelism.
        option_strings:
        - --sglang-load-balance-method
        type:
          $callable: builtins.str
      - default: 1
        dest: sglang_attn_cp_size
        group: options
        help: The attention context parallelism size.
        option_strings:
        - --sglang-attn-cp-size
        - --sglang-attention-context-parallel-size
        type:
          $callable: builtins.int
      - default: 1
        dest: sglang_moe_dp_size
        group: options
        help: The moe data parallelism size.
        option_strings:
        - --sglang-moe-dp-size
        - --sglang-moe-data-parallel-size
        type:
          $callable: builtins.int
      - default: 1
