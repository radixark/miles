# doc-dev: docs/developer/ci/00-stage.md
name: B200 CI

on:
  workflow_call:
    inputs:
      container_image:
        type: string
        required: true
      ref:
        description: 'Git ref to check out (empty = the triggering commit).'
        type: string
        required: false
        default: ''
      cadence:
        type: string
        required: true
      raw_labels:
        type: string
        required: true
      match_all_labels:
        type: boolean
        required: false
        default: false
      run_8_gpu:
        type: boolean
        required: true
      run_4_gpu:
        type: boolean
        required: true
    secrets:
      WANDB_API_KEY:
        required: false
      NEON_DATABASE_URL:
        required: false

permissions:
  contents: read

# Keep one PR's finite task set ahead of the next PR; file reruns share this queue.
concurrency:
  group: b200-oma
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_tests: ${{ steps.plan.outputs.has_tests }}
      ref: ${{ steps.plan.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select each test and its minimum GPU count
        id: plan
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python tests/ci/b200_plan.py \
            --cadence ${{ inputs.cadence }} \
            --labels ${{ inputs.raw_labels }} \
            --suites ${{ inputs.run_8_gpu && 'stage-c-8-gpu-b200' || '' }} ${{ inputs.run_4_gpu && 'stage-c-4-gpu-b200' || '' }} \
            ${{ inputs.match_all_labels && '--match-all-labels' || '' }}

  test:
    needs: plan
    if: needs.plan.outputs.has_tests == 'true'
    name: ${{ matrix.num_gpus }} GPU / ${{ matrix.file }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/_run-ci.yml
    with:
      runs_on: ${{ matrix.runs_on }}
      num_gpus: ${{ matrix.num_gpus }}
      timeout_minutes: ${{ matrix.timeout_minutes }}
      container_image: ${{ inputs.container_image }}
      ref: ${{ needs.plan.outputs.ref }}
      plan_already_resolved: true
      execute_command: >-
        python tests/ci/run_suite.py --hw cuda --suite ${{ matrix.suite }}
        --test-file ${{ matrix.file }}
        --cadence ${{ inputs.cadence }}
        --labels ${{ inputs.raw_labels }}
        ${{ inputs.match_all_labels && '--match-all-labels' || '' }}
    secrets: inherit
