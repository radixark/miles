name: Run CI File
run-name: "/run-ci ${{ inputs.test_file }} (PR #${{ inputs.pull_number }})"

# One registered test file on the PR's current head, dispatched by the
# comment command gateway (/run-ci <test-file>) on the PR head ref. The
# workflow definition, registry, and suites therefore come from that head,
# which must live in this repository -- the same trust the pull_request
# trigger grants a same-repo PR.

on:
  workflow_dispatch:
    inputs:
      pull_number:
        description: 'Pull request number this file run belongs to (audit and concurrency only).'
        required: true
        type: string
      head_sha:
        description: 'Exact PR head SHA the requester saw; the run fails if the dispatched ref has moved past it.'
        required: true
        type: string
      test_file:
        description: 'Registered test file to run, e.g. tests/e2e/megatron/test_qwen3_0.6B.py.'
        required: true
        type: string
      ci_megatron_pr:
        description: 'Megatron-LM branch/commit pin forwarded from the PR body (empty: miles-main).'
        required: false
        type: string
        default: ''
      ci_sglang_pr:
        description: 'SGLang branch/commit pin forwarded from the PR body (empty: sglang-miles).'
        required: false
        type: string
        default: ''
      ci_image_tag:
        description: 'Miles Docker image tag forwarded from the PR body (empty: dev).'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Distinct files on one PR run in parallel; repeats of the same file queue
  # behind the running one instead of cancelling it.
  group: run-ci-file-${{ inputs.pull_number }}-${{ inputs.test_file }}
  cancel-in-progress: false

jobs:
  resolve-file-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      hw: ${{ steps.resolve.outputs.hw }}
      suite: ${{ steps.resolve.outputs.suite }}
      runs_on: ${{ steps.resolve.outputs.runs_on }}
      container_image: ${{ steps.resolve.outputs.container_image }}
    steps:
      - name: Validate dispatch inputs
        shell: bash
        env:
          PULL_NUMBER: ${{ inputs.pull_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          TEST_FILE: ${{ inputs.test_file }}
          DISPATCHED_SHA: ${{ github.sha }}
        run: |
          [[ "$PULL_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::pull_number must be numeric"; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head_sha must be a 40-hex SHA"; exit 1; }
          # The charset below keeps the path safe to interpolate into the
          # suite jobs' execute_command shell lines; the gateway enforces the
          # same shape, and this re-check covers direct dispatches.
          [[ "$TEST_FILE" =~ ^tests/(e2e|fast|fast-gpu|ci)(/[A-Za-z0-9_][A-Za-z0-9_.-]*)*/test_[A-Za-z0-9_][A-Za-z0-9_.-]*\.py$ ]] \
            || { echo "::error::test_file must be a registered tests/ path: $TEST_FILE"; exit 1; }
          if [ "$DISPATCHED_SHA" != "$HEAD_SHA" ]; then
            echo "::error::dispatched ref resolved to $DISPATCHED_SHA, not the requested head $HEAD_SHA; the PR head moved -- re-post /run-ci"
            exit 1
          fi

      - name: Checkout the requested head
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve the file's execution plan
        id: resolve
        env:
          TEST_FILE: ${{ inputs.test_file }}
          CI_IMAGE_TAG: ${{ inputs.ci_image_tag }}
        run: python3 -m tests.ci.file_run

  run-cuda-file:
    needs: resolve-file-run
    if: needs.resolve-file-run.outputs.hw == 'cuda'
    uses: ./.github/workflows/_run-ci.yml
    with:
      runs_on: ${{ needs.resolve-file-run.outputs.runs_on }}
      container_image: ${{ needs.resolve-file-run.outputs.container_image }}
      execute_command: >-
        python tests/ci/run_suite.py --hw cuda
        --suite ${{ needs.resolve-file-run.outputs.suite }}
        --files ${{ inputs.test_file }}
    secrets: inherit

  run-cpu-file:
    needs: resolve-file-run
    if: needs.resolve-file-run.outputs.hw == 'cpu'
    uses: ./.github/workflows/_run-cpu-ci.yml
    with:
      execute_command: >-
        python tests/ci/run_suite.py --hw cpu
        --suite ${{ needs.resolve-file-run.outputs.suite }}
        --files ${{ inputs.test_file }}
    secrets: inherit
