{{- $name := .Values.run.objectNames.platformReader }}
{{- $needed := false }}
{{- range $worker := .Values.run.staticWorkers }}
{{- if eq (default "" $worker.serviceAccountName) $name }}
{{- $needed = true }}
{{- end }}
{{- end }}
{{- if $needed }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "miles-run.labels" (dict "context" . "component" "platform-reader") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "miles-run.labels" (dict "context" . "component" "platform-reader") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "miles-run.labels" (dict "context" . "component" "platform-reader") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ $name | quote }}
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
