# The TMax recipe on hamishivi/Qwen3.5-4B (patched chat template, thinking on) on 2 nodes instead of 4, so each
# experiment costs half the GPUs and schedules more easily. prod_4node_gateway.yaml's recipe unchanged (8 prompts x
# 32 samples, 512 episodes in flight, 64k per episode, DPPO, lr 1e-6, staleness 4, zero-variance filter); only the
# model and layout differ. The 9B run's trainer waited for rollouts 83% of each step, so the training side shrinks to
# 1 node (TP 1 x CP 1 x DP 8, one full 64k trajectory per GPU) and the rollout side to 1 node of 8 SGLang engines,
# 64 episodes each. Smoke-tested by smoke_4b_1node.yaml (memory) and smoke_4b_2node.yaml (this layout, 5 steps).
#   python examples/tmax/beaker/submit.py examples/tmax/configs/prod_2node_gateway_4b.yaml
exp_name: tmax_prod2node_gateway_qwen35_4b
model_name: Qwen3.5-4B-tmax-template
sandbox_backend: gateway
num_nodes: 2
num_gpus_per_node: 8
async_rollout_gpus: 8
rollout_batch_size: 8
n_samples_per_prompt: 32
num_rollout: 500
max_seq_len: 67584
rollout_max_response_len: 16384
max_steps: 64
filter_zero_std: true
max_weight_staleness: 4
async_max_concurrent_samples: 512
async_data_buffer_capacity_factor: 4
tensor_model_parallel_size: 1
context_parallel_size: 1
max_tokens_per_gpu: 67584
optimizer_cpu_offload: false
sglang_mem_fraction_static: 0.8
sandbox_start_concurrency: 64
start_failure: drop
save_interval: 5
hf_snapshot_every: 20
extra_args: "--log-probs-backend fused --distributed-timeout-minutes 120 --sglang-watchdog-timeout 1800"
model_dir: /weka/nora-default/shashankg/miles_tmax_v2/models
data_dir: /weka/nora-default/shashankg/miles_tmax_v2/datasets
# oe-adapt-default filled up on 2026-10-23 and stopped the 9B run; the 4B's checkpoints (about 50 GB each, 3 kept)
# and HF snapshots (about 8 GB every 20 steps) go to the nora bucket.
output_dir: /weka/nora-default/shashankg/miles_tmax_v2/output
trace_dir: /weka/oe-adapt-default/allennlp/deletable_rollouts/miles
dump_training_data: true
wandb_project: oe-general-agents
wandb_entity: ai2-llm

beaker:
  cluster: ai2/holmes
  workspace: ai2/oe-agents-holmes
  budget: ai2/oe-omai
  priority: urgent
  preemptible: true                           # only used without min_runtime (Beaker allows one)
  min_runtime: 8h
  retries: 10
  nodes: 2
  gpus: 8
  shared_memory: 512GiB
  image: docker.io/radixark/miles:dev-202610151741
  dockerhub_username: shashankg209
  gateway_registry: head+sqlite:///weka/oe-adapt-default/gfaria/primebeaker/registries/podman-private-reasoning-20261017.sqlite3
  gateway_min_replicas: 64
  keep_last_n_checkpoints: 3
  env:
    NCCL_DEBUG: WARN
