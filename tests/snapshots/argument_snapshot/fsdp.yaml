        group: options
        help: Launch each DP replica as an independent Megatron instance instead of using Megatron-internal data parallelism.
        nargs: 0
        option_strings:
        - --indep-dp
        type: null
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: delay_split_train_data_by_dp
        group: options
        help: Split the rollout batch across DP ranks on the training side instead of the rollout side, using the training
          side's own DP size.
        nargs: 0
        option_strings:
        - --delay-split-train-data-by-dp
        type: null
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: allgather_cp
        group: options
        help: null
        nargs: 0
        option_strings:
        - --allgather-cp
        type: null
      - default: null
        dest: mfu_peak_tflops
        group: options
        help: Peak dense BF16 TFLOP/s of one training GPU — the denominator of perf/actor_train_mfu. Defaults to a built-in
          table keyed on the device name; set this for a device the table does not know, or to report MFU against another
          precision's peak. With neither available the MFU metric is not logged.
        option_strings:
        - --mfu-peak-tflops
        type:
          $callable: builtins.float
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: recompute_logprobs_via_prefill
        group: options
        help: Recompute rollout logprobs via SGLang prefill instead of decode kernels. Only needed for models whose prefill
          and decode paths are not numerically identical.
        nargs: 0
        option_strings:
        - --recompute-logprobs-via-prefill
        type: null
      - default: null
        dest: custom_agent_function_path
        group: options
        help: null
        option_strings:
        - --custom-agent-function-path
        type:
          $callable: builtins.str
      - default: null
        dest: hf_checkpoint
        group: options
        help: The huggingface checkpoint of the trained model. This is used to initialize sglang and also provide the tokenizer.
          Note that, we will always update the parameters in sglang with that of megatron before training, so you only need
          to provide a huggingface checkpoint that has the same architecture as the model you want to train. It doesn't necessary
          need to contain the most up-to-date parameters.
        option_strings:
        - --hf-checkpoint
        type:
          $callable: builtins.str
      - default: null
        dest: model_name
        group: options
        help: The name of the model, this is used to convert the megatron weights into huggingface format. If not set, we
          will use `type(load_hf_config(args.hf_checkpoint)).__name__.lower()` as model_name. Also, sometimes this will help
          alleviate the bug that transformers cannot find certain model.
        option_strings:
        - --model-name
        type:
          $callable: builtins.str
      - default: null
        dest: rollout_function_path
        group: options
        help: Path to the rollout generation function. Use this to create your own custom rollout function and set this to
          its path. The function is called as `fn(args, rollout_id, data_source, evaluation=evaluation)`, so its signature
          should be `def generate_rollout(args, rollout_id, data_source, evaluation=False) -> RolloutFnTrainOutput | RolloutFnEvalOutput`
          (see `miles.rollout.inference_rollout.inference_rollout_common.InferenceRolloutFn` for the default class-based implementation).
          Within each output sample, set at least `tokens`, `response_length`, `reward`, and `truncated`.
        option_strings:
        - --rollout-function-path
        type:
          $callable: builtins.str
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: fully_async
        group: options
        help: 'Run fully async rollout: a persistent worker keeps generating while the trainer drains completed groups. Selects
          `FullyAsyncRolloutFn` as the rollout function; evaluation keeps the standard rollout function, which fully async
          does not serve. Requires train_async.py.'
        nargs: 0
        option_strings:
        - --fully-async
        type: null
      - default: 1.0
        dest: rollout_temperature
        group: options
        help: the temperature for the inference engine during rollout.
        option_strings:
        - --rollout-temperature
        type:
          $callable: builtins.float
      - default: 1.0
        dest: rollout_top_p
        group: options
        help: the top-p for the inference engine during rollout. Values below 1 enable sampling-support replay and require
          a positive --rollout-top-k.
        option_strings:
        - --rollout-top-p
        type:
          $callable: builtins.float
      - default: -1
        dest: rollout_top_k
        group: options
        help: the top-k for the inference engine during rollout. Positive values enable sampling-support replay. SGLang's
          --sampling-mask-max-tokens is the physical returned-support limit because cutoff ties can retain more than top-k
          tokens.
        option_strings:
        - --rollout-top-k
        type:
          $callable: builtins.int
      - default: null
        dest: rollout_max_response_len
        group: options
        help: The maximum length of the response for the inference engine during rollout. It is basically `max_tokens` in
          sglang.
        option_strings:
        - --rollout-max-response-len
        type:
          $callable: builtins.int
      - choices:
          $set:
          - mooncake
          - ray
        default: ray
        dest: object_store_backend
        group: options
        help: Backend of the object store used to pass data (e.g. rollout data) between processes.
        option_strings:
        - --object-store-backend
        type:
          $callable: builtins.str
      - default: null
        dest: mooncake_store_init_kwargs
        group: options
        help: JSON kwargs used to initialize MooncakeDistributedStore for rollout transfer.
        option_strings:
        - --mooncake-store-init-kwargs
        type:
          $callable: json.loads
      - default: 1
        dest: mooncake_replica_num
        group: options
        help: Number of Mooncake memory replicas for each stored object.
        option_strings:
        - --mooncake-replica-num
        type:
          $callable: builtins.int
      - choices:
          $set:
          - drop
          - retry
        default: drop
        dest: async_unused_samples_handler
        group: options
        help: 'What to do with a finished group fully async mode does not train on (aborted, or beyond --max-weight-staleness):
          drop (default) discards the group; retry recycles its prompts into the data source for regeneration. Groups rejected
          by --dynamic-sampling-filter-path are always dropped.'
        option_strings:
        - --async-unused-samples-handler
        type:
          $callable: builtins.str
      - default: null
        dest: custom_generate_function_path
        group: options
        help: Only substitue the `def generate(args, sample, sampling_params)` function within the example rollout function.
          This should be useful if you need to implement some special rollout logic, e.g. multi-turn, function calling.
        option_strings:
        - --custom-generate-function-path
        type:
          $callable: builtins.str
      - default: 536870912
        dest: update_weight_buffer_size
        group: options
        help: buffer size for update weight, in bytes. This is used for updating weights by batch and should be useful for
          MoE models.
        option_strings:
        - --update-weight-buffer-size
        type:
          $callable: builtins.int
      - default: 1
        dest: update_weights_interval
        group: options
        help: Interval for updating the weights
        option_strings:
        - --update-weights-interval
        type:
          $callable: builtins.int
      - choices:
          $set:
          - abort
          - in_place
          - retract
        default: retract
        dest: pause_generation_mode
        group: options
        help: How SGLang pauses in-flight requests during weight updates. 'abort' immediately terminates all requests (previous
          default). 'retract' moves running requests back to the waiting queue and recomputes KV cache after update. 'in_place'
          freezes requests and resumes with existing KV cache.
        option_strings:
        - --pause-generation-mode
        type:
          $callable: builtins.str
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: keep_old_actor
        group: options
        help: Whether to keep the rollout model on training process
        nargs: 0
        option_strings:
        - --keep-old-actor
        type: null
      - default: null
        dest: rollout_data_postprocess_path
        group: options
        help: The called after we have all the rollout data including log_probs. It may be helpful for updating loss mask.
        option_strings:
        - --rollout-data-postprocess-path
        type:
          $callable: builtins.str
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: pin_rollout_manager_to_head
        group: options
        help: Pin the RolloutExecutor, the co-located router process, and the session servers to the Ray head node. Useful
          in K8s where the head pod has a stable Service address so that external agent environments can reliably reach the
          router.
        nargs: 0
        option_strings:
        - --pin-rollout-manager-to-head
        type: null
      - default: null
        dest: rollout_external_engine_addrs
        group: options
        help: 'Static addresses of externally launched SGLang engines, one per engine cell (the node-0 engine url for multi-node
          engines). Each entry is host:port or http://host:port. Setting this implies external rollout: Miles launches no
          engines and discovers the topology from each engine''s /server_info.'
        nargs: +
        option_strings:
        - --rollout-external-engine-addrs
        type:
          $callable: builtins.str
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: rollout_external_router_pd
        group: options
        help: Launch the router in PD-disaggregation mode for external rollout engines. Internally launched engines infer
          this from the sglang config, but the router starts before external engines are discovered, so a PD external fleet
          must declare it here.
        nargs: 0
        option_strings:
        - --rollout-external-router-pd
        type: null
      - default: null
        dest: custom_inference_engine_provider_path
        group: options
        help: 'Import path of a callable(args, *, capability) returning the BaseWorkerProvider that reports the inference
          engine cells. Setting this implies external rollout. When unset it is filled in automatically: the static discovery
          provider with --rollout-external-engine-addrs, the backend''s own provider otherwise.'
        option_strings:
        - --custom-inference-engine-provider-path
        type:
          $callable: builtins.str
      - choices:
          $set:
          - broadcast
          - disk-delta
          - p2p
        default: broadcast
        dest: update_weight_transfer_mode
        group: options
        help: The method to transfer weights to remote rollout engines during update weight. 'disk-delta' diffs each sync
          against a CPU snapshot of the previous one and publishes only the changed bytes to --update-weight-disk-dir; each
          engine's /pull_weights applies them into a host-local checkpoint that the engine reloads from.
        option_strings:
        - --update-weight-transfer-mode
        type: null
      - default: null
        dest: update_weight_disk_dir
        group: options
        help: 'Filesystem directory disk-delta weight sync publishes to: one delta directory (changed tensors only) per sync,
          written by the trainer and read by every rollout host. Required for --update-weight-transfer-mode=disk-delta.'
        option_strings:
        - --update-weight-disk-dir
        type:
          $callable: builtins.str
      - default: null
        dest: update_weight_local_checkpoint_dir
        group: options
        help: 'Rollout-host-local directory (e.g. NVMe) holding a full HF checkpoint kept in sync by each engine''s /pull_weights:
          every host seeds it from the engine''s model path and patches published deltas in place, and the engines reload
          from it. Required for --update-weight-transfer-mode=disk-delta. The read-side counterpart of --custom-update-weight-post-write-path
          is the engine''s --sglang-custom-pull-weights-pre-read-hook.'
        option_strings:
        - --update-weight-local-checkpoint-dir
        type:
          $callable: builtins.str
      - choices:
          $set:
          - overwrite
          - xor
        default: xor
        dest: update_weight_delta_encoding
        group: options
        help: 'On-disk delta encoding for disk-delta weight sync. ''xor'' (default): new ^ old — smallest wire and fastest,
          but an involution that must be applied exactly once against the correct base (applying it twice reverts). ''overwrite'':
          changed positions + new absolute values — larger, but idempotent. Both are byte-level and dtype-blind; the engine
          reads the choice from each version''s index metadata.'
        option_strings:
        - --update-weight-delta-encoding
        type: null
      - choices:
          $set:
          - adler32
          - blake3
          - xxh3-128
        default: xxh3-128
        dest: update_weight_delta_checksum
        group: options
        help: 'Per-tensor integrity checksum for disk-delta apply. ''xxh3-128'' (default): widest fast non-cryptographic digest.
          ''blake3'': cryptographic, for untrusted storage. ''adler32'': for interop. The engine reads the choice from each
          version''s index metadata.'
        option_strings:
        - --update-weight-delta-checksum
        type: null
      - default: null
        dest: custom_update_weight_post_write_path
        group: options
        help: 'Path to a custom function called on each trainer rank after a disk-delta sync''s files are written, before
          the engines read them — to publish the writes on a non-POSIX filesystem (no cross-host visibility without an explicit
          sync). Signature: ``def hook(args, version_dir: str, rollout_engines) -> None``; the hook gates itself.'
        option_strings:
        - --custom-update-weight-post-write-path
        type:
          $callable: builtins.str
      - default: 30.0
        dest: p2p_transfer_timeout
        group: options
        help: Timeout in seconds for each P2P transfer operation.
        option_strings:
        - --p2p-transfer-timeout
        type:
          $callable: builtins.float
      - default: 300.0
        dest: update_weight_engine_request_timeout
        group: options
        help: Seconds allowed for one weight-update request to a rollout engine before its cell is given up.
        option_strings:
        - --update-weight-engine-request-timeout
        type:
          $callable: builtins.float
      - default: 600.0
        dest: update_weights_timeout
        group: options
        help: Seconds the trainer controller waits for one trainer cell's update_weights before giving it up.
        option_strings:
        - --update-weights-timeout
        type:
          $callable: builtins.float
      - action:
          $callable: argparse.BooleanOptionalAction
        default: null
        dest: namespaced_radix_cache
        group: options
        help: Whether every generation request carries a radix cache key naming the rollout call the sample started under,
          so prefix KV computed under old weights cannot serve samples of a later call. Defaults to true when --fully-async
          is combined with --pause-generation-mode in_place, where the engine never flushes the cache and the staleness of
          a shared prompt is otherwise unbounded; an explicit --no-namespaced-radix-cache is respected.
        nargs: 0
        option_strings:
        - --namespaced-radix-cache
        - --no-namespaced-radix-cache
        type: null
      - default: null
        dest: rollout_max_context_len
        group: options
        help: The maximum context size for the inference engine during rollout.It should no exceed the `max_position_embeddinds`
          in Huggingface model's `config.json`
        option_strings:
        - --rollout-max-context-len
        type:
          $callable: builtins.int
      - default: null
        dest: rollout_max_prompt_len
        group: options
        help: The maximum length of the prompt for the inference engine during rollout. If set, we will filter out the long
          prompts during initialization of the global dataset. This is not recommended if the dataset is large.
        option_strings:
        - --rollout-max-prompt-len
        type:
          $callable: builtins.int
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: rollout_skip_special_tokens
        group: options
        help: Whether to skip special tokens in the response during rollout. This is useful when you want to use the response
          as a prompt for the next rollout.
        nargs: 0
        option_strings:
        - --rollout-skip-special-tokens
        type: null
      - default: null
        dest: rollout_stop
        group: options
        help: The stop words for the inference engine during rollout. It can be a list of strings or a single string. It may
          be hard to pass special tokens in command line, in that case rollout_stop_token_ids can be used.
        nargs: +
        option_strings:
        - --rollout-stop
        type:
          $callable: builtins.str
      - default: null
        dest: rollout_stop_token_ids
        group: options
        help: The stop token ids for the inference engine during rollout. It can be a list of integers or a single integer.
        nargs: +
        option_strings:
        - --rollout-stop-token-ids
        type:
          $callable: builtins.int
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: rollout_shuffle
        group: options
        help: Whether to shuffle the prompts during rollout.
        nargs: 0
        option_strings:
        - --rollout-shuffle
        type: null
      - default: 42
        dest: rollout_seed
        group: options
        help: The seed for the random number generator during rollout. This is used to shuffle the prompts and also for the
          random sampling of the prompts.
        option_strings:
        - --rollout-seed
        type:
          $callable: builtins.int
      - default: null
        dest: over_sampling_batch_size
        group: options
        help: This defines the granularity of the sampling batch in the rollout function. When the number of available samples
          falls below the target, a sampling operation of size over_sampling_batch_size will be triggered.Regardless of whether
          partial rollout is used or filters are applied, the sampling granularity is always determined by this value. If
          this value is None, rollout_batch_size will be used as the default over_sampling_batch_size.
        option_strings:
        - --over-sampling-batch-size
        type:
          $callable: builtins.int
      - default: null
        dest: dynamic_sampling_filter_path
        group: options
        help: This is the filter function for dynamic sampling. It should be able to judge whether the result of a prompt
          should be selected or not.We will do dynamic filter for sampling as in DAPO. e.g. not all correct or all wrong samples.You
          could use `miles.rollout.filter_hub.dynamic_sampling_filters.check_reward_nonzero_std` as an example.
        option_strings:
        - --dynamic-sampling-filter-path
        type:
          $callable: builtins.str
      - choices:
          $set:
          - group
          - sample
        default: null
        dest: rollout_submission_granularity
        group: options
        help: 'Granularity at which a completed unit frees rollout submission capacity. `group` holds a slot until the whole
          prompt group returns; `sample` frees each slot as its own sample finishes, so a replacement group goes out once
          n_samples_per_prompt samples complete, whichever groups they came from. Prompt groups are submitted whole either
          way. Unset picks the driver default: `sample` under --fully-async, where groups completed beyond the batch are queued
          for later steps; `group` otherwise, where they are aborted at the end of the step and, without --partial-rollout,
          discarded.'
        option_strings:
        - --rollout-submission-granularity
        type:
          $callable: builtins.str
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: partial_rollout
        group: options
        help: Whether to use partial rollout. If set, the unfinished samples during dynamic sampling will be recycled back
          to data buffer. This is useful for long responses.
        nargs: 0
        option_strings:
        - --partial-rollout
        type: null
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: mask_offpolicy_in_partial_rollout
        group: options
        help: Whether to mask previous generation in partial rollout. If set, only on-policy generated tokens will be used
          in training
        nargs: 0
        option_strings:
        - --mask-offpolicy-in-partial-rollout
        type: null
      - default: null
        dest: max_weight_staleness
        group: options
        help: Maximum allowed gap between a group's oldest generated-token weight version and the current engine weight version.
          Prompt KV weight staleness is not considered. Groups exceeding this threshold are recycled back to the data buffer
          instead of being sent to training. Only effective in fully async mode. None (default) disables staleness filtering.
        option_strings:
        - --max-weight-staleness
        type:
          $callable: builtins.int
      - default: null
        dest: async_max_concurrent_samples
        group: options
        help: Maximum number of concurrently generating trajectories in fully async mode, decoupling generation concurrency
          from the training batch size. None (default) keeps the legacy bound of one training batch worth of trajectories
          (rollout_batch_size groups, i.e. rollout_batch_size * n_samples_per_prompt).
        option_strings:
        - --async-max-concurrent-samples
        type:
          $callable: builtins.int
      - default: 2.0
        dest: async_data_buffer_capacity_factor
        group: options
        help: Capacity of the finished-group data buffer between rollout production and training consumption in fully async
          mode, as a multiple of rollout_batch_size (floor(factor * rollout_batch_size) groups). When the buffer is full the
          producer blocks until training consumes, so generation cannot run unboundedly ahead of training.
        option_strings:
        - --async-data-buffer-capacity-factor
        type:
          $callable: builtins.float
      - default: null
        dest: custom_async_data_buffer_path
        group: options
        help: Path to a custom DataBuffer subclass replacing the fully async finished-group data buffer (see miles/rollout/fully_async_data_buffer.py).
          Constructed with DataBufferConstructorInput; it takes over dataflow/staleness control, so the --async-data-buffer-*
          args apply only if the custom class reads them.
        option_strings:
        - --custom-async-data-buffer-path
        type:
          $callable: builtins.str
      - default: null
        dest: custom_rollout_log_function_path
        group: options
        help: 'The custom function for logging rollout data. The signature of the functions is: def log_rollout_data(rollout_id,
          args, samples, rollout_extra_metrics, rollout_time) -> bool. The return value indicates whether to skip the default
          logging. '
        option_strings:
        - --custom-rollout-log-function-path
        type:
          $callable: builtins.str
      - default: null
        dest: custom_eval_rollout_log_function_path
        group: options
        help: 'The custom function for logging eval rollout data. def log_eval_rollout_data(rollout_id, args, data, extra_metrics)
          -> bool. The return value indicates whether to skip the default logging. '
        option_strings:
        - --custom-eval-rollout-log-function-path
        type:
          $callable: builtins.str
      - default: null
        dest: buffer_filter_path
        group: options
        help: Path to the buffer filter function. It should be able to select the samples in the buffer. The function should
          take list[list[Sample]] and return list[list[Sample]].
        option_strings:
        - --buffer-filter-path
        type:
          $callable: builtins.str
      - action:
          $callable: argparse._StoreTrueAction
        const: true
        default: false
        dest: use_fault_tolerance
        group: options
        help: Enable fault tolerance. Use --ft-components to select which components.
        nargs: 0
        option_strings:
        - --use-fault-tolerance
        type: null
      - choices:
          $set:
          - rollout
          - train
        default: null
        dest: ft_components
        group: options
        help: 'FT components to enable (requires --use-fault-tolerance). Choices: rollout, train. Default when omitted: rollout.'
        nargs: +
        option_strings:
        - --ft-components
        type: null
      - default: 127.0.0.1
        dest: api_server_host
        group: options
        help: Host the HTTP api server binds to. The default only serves the local mini fault-tolerance controller; set 0.0.0.0
          to accept remote controllers.
        option_strings:
        - --api-server-host
        type:
          $callable: builtins.str
      - default: null
        dest: api_server_port
        group: options
        help: Port for HTTP api server. 0 = disabled. Left unset it is 18080 under --use-fault-tolerance and 0 otherwise,
          because the mini fault-tolerance controller drives cells over this port.
        option_strings:
        - --api-server-port
        type:
          $callable: builtins.int
      - action:
          $callable: argparse.BooleanOptionalAction
        default: null
        dest: mini_ft_controller_enable
        group: options
        help: Enable the mini fault-tolerance controller that auto-heals Fatal cells. Left unset it follows --ft-components
          and --api-server-port, which is what makes --use-fault-tolerance heal on its own.
        nargs: 0
        option_strings:
        - --mini-ft-controller-enable
        - --no-mini-ft-controller-enable
        type: null
      - default: 10.0
        dest: mini_ft_controller_poll_interval
        group: options
        help: Interval in seconds between cell health polls.
        option_strings:
        - --mini-ft-controller-poll-interval
        type:
          $callable: builtins.float
      - default: 10.0
        dest: mini_ft_controller_resume_delay
        group: options
        help: Delay in seconds between suspending and resuming a cell during heal.
        option_strings:
        - --mini-ft-controller-resume-delay
        type:
          $callable: builtins.float
      - default: 30.0
        dest: rollout_health_check_interval
        group: options
        help: Interval in seconds between rollout-health-check health checks.
        option_strings:
        - --rollout-health-check-interval
        type:
          $callable: builtins.float
      - default: 30.0
        dest: rollout_health_check_timeout
        group: options
        help: Timeout in seconds for a single rollout-health-check health check RPC.
        option_strings:
        - --rollout-health-check-timeout
        type:
          $callable: builtins.float
      - default: 0.0
        dest: rollout_health_check_first_wait
        group: options
        help: Initial grace period (seconds) before starting rollout-health-check health checks, re-armed on every resume.
