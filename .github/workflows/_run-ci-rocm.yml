name: CI Job (ROCm)

on:
  workflow_call:
    inputs:
      execute_command:
        type: string
        required: true
      runs_on:
        type: string
        required: false
        description: 'JSON-encoded list of runner labels (all required). e.g. ''["linux-miles-mi35x-spur"]'' picks the Spur login-node runners. No default: GPU jobs must pass this explicitly.'
      num_gpus:
        description: 'GPUs per shard: the cluster job asks the scheduler for this many (1, 2, 4 or 8).'
        type: number
        required: false
        default: 4
      container_image:
        # No default: tests/ci/rocm.py resolves the image for every caller.
        type: string
        required: true
      timeout_minutes:
        description: 'Job budget, including Slurm queueing, setup, execution, and cleanup. The run step keeps its own 240-minute limit, so values above 250 do not extend the run; keep it at least 10 minutes above that limit for the cancel step. launch.sh still caps the cluster job at its 3-hour TIME_LIMIT.'
        type: number
        required: false
        default: 250
      skip_dependency_install:
        description: 'Keep the SGLang and Megatron-LM versions baked into the ROCm image.'
        type: boolean
        required: false
        default: false
      plan_already_resolved:
        description: 'Skip hosted planning when a trusted caller already selected one enabled test at an exact ref.'
        type: boolean
        required: false
        default: false
      withhold_runner_secrets:
        description: 'Unset the runner HF_TOKEN, WANDB_API_KEY and AMD_NEON_DATABASE_URL before launch. A credential boundary only for /rerun-test, whose launcher comes from main; a pull_request launcher is PR code on the login runner.'
        type: boolean
        required: false
        default: false
      ref:
        description: 'Git ref to check out (empty = the triggering commit). Set by release CI to test a release branch.'
        type: string
        required: false
        default: ''
    secrets:
      AMD_WANDB_API_KEY:
        required: false
      AMD_NEON_DATABASE_URL:
        required: false

jobs:
  plan:
    if: ${{ !inputs.plan_already_resolved }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_tests: ${{ steps.select.outputs.has_tests }}
      ref: ${{ steps.select.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve suite plan
        id: select
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          ${{ inputs.execute_command }} --list-only --github-output "$GITHUB_OUTPUT"

  deps:
    needs: plan
    if: |
      !cancelled() && !inputs.skip_dependency_install &&
      (inputs.plan_already_resolved ||
        (needs.plan.result == 'success' && needs.plan.outputs.has_tests == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ci_sglang_pr: ${{ steps.resolve-refs.outputs.ci_sglang_pr }}
      ci_megatron_pr: ${{ steps.resolve-refs.outputs.ci_megatron_pr }}
    steps:
      - name: Checkout dependency source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.plan_already_resolved && inputs.ref || needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout CI actions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-actions
          sparse-checkout: .github/actions/resolve-dependency-refs
          persist-credentials: false
      - name: Resolve dependency refs
        id: resolve-refs
        uses: ./.ci-actions/.github/actions/resolve-dependency-refs
        with:
          megatron_ref: ${{ github.event.inputs.ci_megatron_pr || '' }}
          sglang_ref: ${{ github.event.inputs.ci_sglang_pr || '' }}
          pr_body: ${{ github.event.pull_request.body || '' }}

  run:
    needs: [plan, deps]
    if: |
      !cancelled() &&
      (inputs.plan_already_resolved ||
        (needs.plan.result == 'success' && needs.plan.outputs.has_tests == 'true')) &&
      (inputs.skip_dependency_install || needs.deps.result == 'success')
    # The runners are Spur (Slurm) login-node runners on AMD's MI355X cluster:
    # the job itself does no GPU work. launch.sh submits one cluster job per
    # shard, and that job runs container_steps.sh in the ROCm CI image with
    # only the GPUs the scheduler assigned it (see .github/workflows/scripts/spur/).
    #
    # fromJSON parses the input list so `runs-on` receives an actual array.
    # Without this, GitHub treats the string verbatim as one label literal
    # (e.g. the label name '["linux-miles-mi35x-spur"]' with brackets), which
    # no runner carries, and the job queues forever.
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}

    steps:
      # Launch scripts run on the login runner from the workflow revision:
      # main for /rerun-test, but the PR merge commit for pull_request runs,
      # so a pull_request launcher is PR-controlled.
      - name: Checkout cluster launcher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/workflows/scripts/spur
          sparse-checkout-cone-mode: false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.plan_already_resolved && inputs.ref || needs.plan.outputs.ref }}
          path: pr-source
          persist-credentials: false

      - name: Resolve Megatron Bridge override
        id: resolve-bridge
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          INPUT_BRIDGE_PR: ${{ github.event.inputs.ci_megatron_bridge_pr || '' }}
        run: |
          # Same directive as .github/actions/install-megatron-bridge, which
          # can't run here; container_steps.sh does its install and check.
          BRIDGE_PR="${INPUT_BRIDGE_PR}"
          if [ -z "$BRIDGE_PR" ] && [ -n "$PR_BODY" ]; then
            BRIDGE_PR=$(printf '%s\n' "$PR_BODY" | grep -m1 -oP '^ci-megatron-bridge-pr:\s+\K\S+' || true)
          fi
          if [ -n "$BRIDGE_PR" ] && [[ ! "$BRIDGE_PR" =~ ^#[0-9]+$ ]] && [[ ! "$BRIDGE_PR" =~ ^[A-Za-z0-9_][A-Za-z0-9_./-]*$ ]]; then
            echo "::error::Invalid Megatron Bridge ref: $BRIDGE_PR"
            exit 1
          fi
          if [[ "$BRIDGE_PR" =~ ^#([0-9]+)$ ]]; then
            BRIDGE_PR="refs/pull/${BASH_REMATCH[1]}/head"
          fi
          echo "ci_bridge_pr=$BRIDGE_PR" >> "$GITHUB_OUTPUT"
          echo "Resolved: bridge=${BRIDGE_PR:-none}"

      # HF_TOKEN and the Docker Hub login come from the runner's .env, not repo
      # secrets; do not set them here, since even an empty value overrides the
      # runner's.
      - name: Run tests on a cluster node
        timeout-minutes: 240
        shell: bash
        env:
          CI_SRC: ${{ github.workspace }}/pr-source
          WITHHOLD_RUNNER_SECRETS: ${{ inputs.withhold_runner_secrets }}
          CI_IMAGE: ${{ inputs.container_image }}
          CI_COMMAND: ${{ inputs.execute_command }}
          CI_SKIP_DEPENDENCY_INSTALL: ${{ inputs.skip_dependency_install }}
          MEGATRON_PR: ${{ needs.deps.outputs.ci_megatron_pr }}
          SGLANG_PR: ${{ needs.deps.outputs.ci_sglang_pr }}
          BRIDGE_REF: ${{ steps.resolve-bridge.outputs.ci_bridge_pr }}
          MILES_HARDWARE_PLATFORM: rocm
          GITHUB_COMMIT_NAME: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}_${{ github.event.pull_request.number || github.event.inputs.pull_number || 'non-pr' }}
          WANDB_API_KEY: ${{ secrets.AMD_WANDB_API_KEY }}
          AMD_NEON_DATABASE_URL: ${{ secrets.AMD_NEON_DATABASE_URL }}
          # libpq connect timeout: if the store is unreachable from the cluster, each gated
          # test loses 10 s instead of psycopg's 130-second default.
          PGCONNECT_TIMEOUT: '10'
          # The CI partition is shared with SGLang's CI and sgl-amd-mono; Miles
          # owns crsuse2-m2m-v3-025 and v3-090, so keep its jobs off the rest.
          SLURM_EXCLUDE: crsuse2-m2m-v3-010,crsuse2-m2m-v3-022,crsuse2-m2m-v3-060,crsuse2-m2m-v3-123
        run: |
          if [ "$WITHHOLD_RUNNER_SECRETS" = "true" ]; then
            unset HF_TOKEN WANDB_API_KEY AMD_NEON_DATABASE_URL
          fi
          bash .github/workflows/scripts/spur/launch.sh --gpus "${{ inputs.num_gpus }}"

      - name: Cancel cluster jobs on failure/cancel
        if: failure() || cancelled()
        continue-on-error: true
        shell: bash
        run: |
          # Same prefix launch.sh names its jobs with. %200j widens the name
          # column; Spur's squeue does not accept --me.
          PREFIX="miles-ci-${RUNNER_NAME}-${GITHUB_RUN_ID}-"
          JOBS=$(squeue --noheader --format="%i %200j" | grep -F "$PREFIX" | awk '{print $1}' || true)
          if [ -n "$JOBS" ]; then
            echo "Cancelling: $JOBS"
            scancel $JOBS
          fi
